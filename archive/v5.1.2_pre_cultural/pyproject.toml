[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sic_games"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mesa>=3.5",
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
