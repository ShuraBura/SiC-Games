seed: 42
world:
  grid_size: [50, 50]
  toroidal: true
  sugar_peaks: [[10, 40], [40, 10]]
  max_sugar_capacity: 4
  band_width_k: 6
  growth_rate_alpha: 1
agents:
  initial_population: 250
  vision_dist: [1, 6]
  metabolic_rate_dist: [1, 4]
  max_age_dist: [60, 100]
  initial_wealth_dist: [5, 25]
  phi_mean: 0.5
  phi_std: 0.2
decision:
  strategy: "carbon"
carbon:
  sigma_base: 0.5
  kappa: 2.0
  cred_scale: 10.0
  cred_decay: 0.01
  matthew_alpha: 1.5
  epsilon: 0.01
  cred_bonus_per_participant: 1.0
joint_task:
  distance_d: 1
  capacity_threshold: 4
run:
  n_steps: 1000
  metrics_every: 1
  output_dir: "outputs/stage2_carbon_seed42"
visualization:
  animate: true
  frames_per_save: 5
  save_static_plots: true
