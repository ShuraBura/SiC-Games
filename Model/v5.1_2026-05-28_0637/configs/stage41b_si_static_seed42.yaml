seed: 42
world:
  grid_size: [50, 50]
  toroidal: true
  sugar_peaks: [[10, 40], [40, 10]]
  max_sugar_capacity: 4
  band_width_k: 6
  growth_rate_alpha: 1
agents:
  initial_population: 250
  vision_dist: [1, 6]
  metabolic_rate_dist: [1, 4]
  max_age_dist: [60, 100]
  initial_wealth_dist: [5, 25]
  phi_mean: 0.5
  phi_std: 0.2
  psi_mean: 0.5
  psi_std: 0.2
  c1_mean: 0.5
  c1_std: 0.2
  c2_mean: 0.5
  c2_std: 0.2
decision:
  strategy: "si_bounded"
si_bounded:
  sigma_si: 1.238
joint_task:
  distance_d: 1
  capacity_threshold: 4
population:
  mode: "dynamic"
birth_c:
  p_max: 0.02
  tau_sub: 5.0
  r_stress: 0.75
  r_wealth: 0.5
  rep_age_min: 15
  rep_age_max: null
birth_si:
  p_fission_max: 0.14  # 0.13 collapsed, 0.15 N_eq>400; try midpoint
  fission_wealth_mult: 1.5
  rep_age_min: 15
  rep_age_max: null
reproduction:
  mode: "random"
  parent_radius: 3
  inherit_sigma: 0.05
  coordinator: "individual"
  lambda_inheritance: 0.0
perturbation:
  type: "null"
initialization:
  age_distribution: "realistic"
life_history:
  forage_age_min: 15
  forage_age_max_offset: 10
  eta_min: 0.3  # raised from 0.2: juvenile starvation was 72%/69% > 60% threshold
  eta_old: 0.4
run:
  n_steps: 1000
  metrics_every: 1
  output_dir: "outputs/stage41b_si_static_seed42"
visualization:
  animate: false
  save_static_plots: false
