# — overflow ⟺ well-fed (so the wife is also full, need≈0); scarcity ⟺ wife-need (but then the husband has
# 0 overflow). Measured at a crowded equilibrium: 0% of married men had any overflow, 100% of wives had
# full need ⇒ zero transfers. Root cause is R-16 fertility-pinning: no surplus at r=0, so von Rueden's
# DOMINANT channel (status→fertility, "enhances fertility more than offspring well-being") cannot operate
# here. See RESULTS R-80. B++ : ASSORTATIVE mating. The father a mother draws is weighted by his prowess^m
# (the B+ skew) AND his status-SIMILARITY to the mother — a Gaussian-in-log-status kernel exp(−α·(ln s_j −
# ln s_i)²), s = cred· prowess, α = assortative_strength. So high-status mothers pair with high-status
# fathers, CONSOLIDATING dynasties (vs B+'s one-sided draw that dilutes the dynasty through random
# maternal lineage each generation). 0 = B+ (no assortment — the paired control). Requires
