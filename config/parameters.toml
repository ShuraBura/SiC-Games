# ── WEALTH → OBLIGATION → PRODUCTION (2026-07-27) ─────────────────────────────────────────── TYPE **C
# (Conversion)** · UNIT **agent pair** · INVARIANT **DEBITED** (the grant SPENDS material) · ANCHOR
# [Sahlins 1963, VERIFIED, already filed in LITERATURE.md]. THE DIAGNOSIS THIS FIXES. Material never
# concentrated in the elite - noble_material_lift 0.87-1.04 - and it survived every explanation tried: not
# decay (zeroing it changed nothing), not leveling (off changed nothing), not elite breadth (narrowing 51%
# -> 16% doubled the PEOPLE lift and left material at 0.99). The cause is structural: `material` is a
# TERMINAL STOCK. It is produced from hunting, it sits, it decays, and it cannot buy anything. A stock
# with no investment channel cannot compound, so per-capita concentration stays flat however well it is
# protected. That is also why the model's elite is in PEOPLE - followers are the only asset that
# compounds, so they are the only elite we ever see. Sahlins on the Melanesian big-man: "Deploying his
# resources carefully, the emerging leader USES WEALTH TO PLACE OTHERS IN HIS DEBT ... he constructs a
# following whose production may be harnassed to his ambition." Wealth's function is conversion - into
# obligation, and obligation into others' production. MECHANISM: a creditor spends `material` to feed a
# band-mate in deficit (the grant is debited from the creditor and arrives as kcal, which is what a hungry
# agent can use). In return he holds a claim on that agent's future durable output until the debt is
# discharged. Conversion rate is NOT invented: it is the inverse of the model's own production relation,
# material = material_hide_frac x meat kcal. FEAST CADENCE (2026-07-27). Sacrifices are events at
# gatherings, not a per-step bleed. Applying `legit_feast_frac` every step drained ~97%/yr of the durable
# stock and made the elite the set of agents who had spent their wealth on rank (measured: 673:1 against
# tribute). Legitimacy is a SHARE of band feasting, so scaling everyone's spend leaves the status outcome
# alone — the cadence was free for status and decisive for wealth. 12 = annual, matching
# `aggregation_period`. 0 = the old per-step behaviour.

