# partiality, or unresponsiveness in a leadership role" (10) = FAILURE TO DELIVER. Hence
# `office_overreach_weight` = 19/29. THE LOOP THIS CLOSES: overreach is read off the leader's OWN material
# relative to his band — which is exactly what `leader_share_frac` inflates. A greedier levy raises the
# sanction hazard on the man taking it. Boehm's reverse dominance hierarchy as a feedback loop, not a
