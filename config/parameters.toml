[orphan_normalize]
value = true
owner = "DemographyConfig"
type  = "bool"
# DOUBLE-COUNT GUARD — normalise by E[mult] over the population's OWN children (`_orphan_e_mult_live`).
# The Siler a1 was fit to OBSERVED Aché mortality, which already contains these deaths ("infanticide
# KEPT"), so applying the multipliers raw would kill the same children twice. Why ENDOGENOUS and not the
# Aché constant? This model is **fertility-pinned** (R-16): held at r=0 its equilibrium e₀ is ~28, whereas
# the Aché had TFR≈8 AND e₀≈36.5 — NRR>1, a GROWING population. A stationary population must therefore
# orphan MORE children, and it does: measured E[mult] ≈ 3.28 vs the Aché's 1.499, motherless ~10% vs their
# ~2% exposure (the analytic agrees: a2_mult≈3 ⇒ 10.7%). Dividing by a constant fitted to a growing
# population moved eq_pop **−47%**; normalising by the population's own mean gives **−2.4%** — i.e.
# exactly compositional: WHO dies is orphan-graded, HOW MANY stays fertility-pinned. Same split R-16/R-18
# established for the Cred hierarchy.

[orphan_e_mult]
value = 1.499
owner = "DemographyConfig"
type  = "float"
# The Aché reference value, kept for documentation + the Table 13.1 arithmetic check. NOT used by the
# model (which normalises endogenously). E[mult] at Tab. 13.1's own means (mother alive 0.98, father alive
# 0.95, divorced 0.14 | both living): (0.98 + 0.02·5.09) · (0.95 + 0.05·3.05) · [P(¬both) + P(both)·(0.86
# + 0.14·2.97)] = 1.0818 · 1.1025 · (0.069 + 0.931·1.2758) = 1.499 Aché REFERENCE ONLY — see
# `_orphan_e_mult_live`

