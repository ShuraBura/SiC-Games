type  = "float"
# central-place bonus magnitude (× BURN × normalized suitability); UNANCHORED (sweep) — (channel note,
# inherited) Stage 1b — TERRAIN-DEPENDENT MOVEMENT COST: relocating burns energy scaled by terrain
# difficulty (the terrain `cost` field ∈[0.15,1], slope/elev-driven, water=1). Realized cost =
# move_cost_kcal·cost[dest] DRAINED at metabolism (moving repeatedly depletes reserve → selection for
# sedentism) AND PERCEIVED in the IFD utility (agents prefer to stay / take cheap-terrain steps →
# central-place foraging, prime real-estate valued). Locomotion was previously FREE (move_cost_flat=0,
# fixed per-step BURN). Default OFF ⇒ no move cost, bit-exact. Stage 1c — CATCHMENT SITE-APPRAISAL
# (Kennett-Winterhalder IFD-suitability + Vita-Finzi catchment + Orians-Pearson central place): a static
# per-cell SITE-VALUE field = Σ_{catchment} S_pot(c')·exp(−λ·dist·(0.5+cost(c'))) — the resource potential
# of the surrounding catchment DISCOUNTED by cost-distance (rugged/far cells contribute less). Normalized
# [0,1], scaled by site_gain·BURN, PERCEIVED in the IFD utility (occupancy-independent). This gives a
# GLOBAL gradient that agents climb toward prime central places → solves the ASSEMBLY problem (converge on
# best catchment, not coordinate) + values prime real-estate + tightens communities onto catchment cores.
# Perceived-only (anticipation) — actual food is still forage cap + point-superlinear + storage (no
# double-count). Default OFF ⇒ bit-exact.

