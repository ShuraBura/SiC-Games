# max repulsion (subtracted from cohesion_frac). ANCHORED value = 1.0 (Alberti P); village stack uses 0.3
# — (channel note, inherited) Social-Evolution Stage 1b: SIZE-DRIVEN REPULSION (Johnson 1982 scalar
# stress) — a DISPERSIVE counterweight to cohesion, rising with band size N via a logistic (Alberti 2014
# shape), SUBTRACTED from the cohesion_frac so a large band needs MORE cohesion (assabiyah+leader) to stay
# whole. DISTINCT from the existing resource- scarcity fission (that runs through assabiyah↓ when surplus
# is low; this is resource-INDEPENDENT, purely coordination cost). Boehm/Johnson coupling: scalar stress
# is what organizational HIERARCHY exists to absorb, so the repulsion is scaled by
# REPULSION_SOCIETY_FACTOR — FULL in egalitarian mobile bands (no hierarchy → capped ~small), RELIEVED in
# complex/stratified (settling + institutions let a group grow toward the hard cap). The midpoint is the
# band-scale scalar-stress onset (≈ the Wobst-minimal band); the width is Alberti's logistic shape
# re-anchored to band scale (village-scale N≈127 → band scale — a bracket, not a fit, cf. the regime
# °C→CC% re-anchoring). Requires enable_dynamic_bands. Default OFF ⇒ repulsion≡0, bit-exact. Johnson 1982
# scalar stress as a dispersive term. **The anchor is Alberti 2014** (PLoS ONE 9(3):e91510), who fits
# P(critical scalar stress | community size n) by logistic regression on archaeological + ethnographic
