[enable_orphan_mortality]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── KIN/ORPHAN CHILD MORTALITY (Hill & Hurtado 1996 Table 13.1; MODEL_SPEC §4.6.4; R-74) ──────────
# SUPERSEDES `enable_infanticide` (below). Losing a parent — not birth-spacing — is the dominant killing
# channel among the forest Aché, and it is a HAZARD MULTIPLIER, not a separate event. Table 13.1 ("Kin
# Effects on Child Mortality Rates during the Forest Period: Age 0–9"), a hazard model controlling age,
# age², sex, mother's age, mother's age². Log-parameters → rate ratios: mother alive −1.6277 (p<.001) ⇒
# mother DEAD ×exp(1.6277) = 5.09 ["about fivefold"] father alive −1.1146 (p<.001) ⇒ father DEAD
# ×exp(1.1146) = 3.05 ["about threefold"] parents divorced +1.0892 (p<.001) ⇒ ×exp(1.0892) = 2.97
# ["threefold increase"] Every OTHER kin category is null: adult brothers/sisters, grandmothers,
# grandfathers, aunts, uncles, total kin helpers (p .156–.990) — "parents, but NOT other kin, have a
# strong and unique influence." Mechanism: "A good deal of this effect is due to child homicide" + orphans
# "treated worse" — Table 5.1's homicide/neglect is 39.7% of 0–3 deaths (child homicide 24,
# sacrificed-with-adult 11, left-behind 5, parental infanticide only 7 of 131 = 5.3%). Effects are
# age-PROPORTIONAL (no significant age interaction).

[enable_infanticide]
value = false
owner = "DemographyConfig"
type  = "bool"
# SUPERSEDED by enable_orphan_mortality (R-74) — never implemented; no logic reads it. Scoped in the Siler
# blueprint §4.1 as birth-spacing/sex-biased infanticide, but Table 5.1 shows parental infanticide is only
# 5.3% of Aché infant deaths, and infancy is nearly sex-SYMMETRIC (38% of male vs 41% of female infant
# deaths are homicide/neglect) — the sex bias is at ages 4–14 (28% F vs 6% M) and comes from grave
# accompaniment (80% of children buried with a deceased adult are female), not from infanticide.
# [UNIMPLEMENTED STUB — no logic reads this.] Baseline infanticide is ALREADY

[enable_energetic_fertility]
value = true
owner = "DemographyConfig"
type  = "bool"
# folded into the Siler infant-mortality curve (fit to observed HG infant deaths — "infanticide KEPT"). An
# explicit mechanism would only add CONDITIONAL infanticide (birth-spacing enforcement / sex-selective);
# the resource-stress channel overlaps enable_energetic_fertility, sex-selection is a separate future
# scoping. Documented stub, not built. economy-fix (Tier-0): births scale with maternal reserve, capping
# the population BEFORE reserves drain to the starvation floor → realistic equilibrium reserve (red-team
# 2b prerequisite)

[enable_intake_fertility]
value = true
owner = "DemographyConfig"
type  = "bool"
# INTAKE-based energetic fertility (supersedes the reserve-based branch above when ON). Measured
# 2026-07-30: the reserve-based version is INERT by construction. Burn is ~68% of the floor-to-full span
# per step, so an agent either re-saturates at the cap or dies within a step; there is no persistent
# intermediate state. Post-harvest reserve reads 0.996 of full and the post-burn trough 0.318, each with
# spread ~0.002 and ZERO response across a 5x density range, so the factor returns ~0.995 always and
# fertility cannot respond to scarcity. Regulation therefore falls entirely on mortality (CDR +59% while
# CBR moves 3%), which forces e0 = 1/CDR ~ 20.7 yr, median age 13 and 8-11% motherless. INTAKE is the live
# signal the reserve level cannot be: p10 0.93 to p90 4.26 of requirement. Ellison's energetics is the
# mechanism — fecundity tracks energy FLUX, not stored reserve.

[enable_dependent_load]
value = true
owner = "DemographyConfig"
type  = "bool"
# slow enough that one bad month does not stop births, fast enough to track a multi-year squeeze DEPENDENT
# LOAD (requires enable_intake_fertility). A mother's energy budget is not her own maintenance — she must
# also cover what her juveniles cannot produce. Counting only her own needs understates the cost of a
# further birth for a woman who already has dependents, which is the anchored driver of forager birth
# spacing (Blurton Jones, Hadza; Kaplan's provisioning model). Denominator becomes own requirement + the
# sum of her living juveniles' UNMET need (their requirement minus what they gathered themselves), so a
# child who increasingly feeds itself costs her less — the load falls as they age, without any explicit
# schedule. BUILT BUT CURRENTLY INERT — and the reason is a finding, not a wiring bug (2026-07-30, R-106).
# Life-history IS on in the village/elite presets (eta_min 0.2, cons_min 0.3, mother-links 91%), yet only
# 1.0% of juveniles run any deficit: measured juvenile eta med 0.529 against consumption_factor med 0.588,
# and with adults harvesting ~1.7x their own burn a juvenile still gathers ~1.5x its requirement. So
# CHILDREN IN THIS MODEL ARE NET FOOD PRODUCERS, which contradicts the Kaplan 2000 net-deficit anchor that
# `consumption_factor` itself cites — the anchor human life-history theory rests on (long juvenile period,
# provisioning, grandmothering). There are no dependents to load. Same root cause as the fertility brake:
# at ~1.7x surplus intake everyone over-produces, including seven-year-olds. UNBLOCK BY: recalibrating the
# juvenile eta ramp against Kaplan's production/consumption curves (foragers do not break even until
# ~18-20 yr), NOT by tuning this mechanism. Kept default-OFF and bit-exact.

[enable_sedentism_fertility]
value = true
owner = "DemographyConfig"
type  = "bool"
# pregnancy is ~+285 ⇒ +11%, lactation ~+20%, so full reproductive capacity needs ~1.2x maintenance)
# SEDENTISM fertility (Neolithic Demographic Transition): birth-spacing SHORTENS with sedentism/complexity
# — mobile foragers space births ~44 mo (carrying cost + prolonged lactational amenorrhea on a low-fat
# mobile diet; !Kung, Howell), sedentary/complex/farming ~24-30 mo (no carrying cost + storable weaning
# foods → earlier weaning → shorter amenorrhea; Sellen & Mace 2007), ~doubling the birth rate
# (Bocquet-Appel 2011). The mother's `ibi_ refractory_months` becomes society-dependent
# (SEDENTISM_IBI_MONTHS). Multiplies with `enable_energetic_fertility` (nutritional-stress suppression
# stays on top). Default OFF ⇒ uniform IBI (bit-exact).

[enable_standing]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── SOCIAL CAPITAL / STANDING — the village anchor with a REAL payoff (P6). Wiessner 1977 (!Kung
# *hxaro*): exchange partnerships need **≥1 yr of reciprocal gifting** before the bond is "firm", each
# person sits in a network of paths, and THAT NETWORK is what covers you in bad years. Status is also
# within-community (von Rueden) — a migrant arrives a low-status outsider. So standing is a RELATIONAL
# third status facet: it accrues with TENURE among your co-resident band and is largely LOST on leaving.
# Because `base_status` weights the harvest contest, the granary draw AND mate choice, leaving is a real
# FITNESS cost — this is the anchor that holds a village together, and it makes dispersal SELECTIVE
# (low-standing juniors leave; established/elite stay). Default OFF ⇒ facet absent, bit-exact.

[enable_store_anchor]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── STORE ANCHOR (P1). The cell granary is a REAL payoff (allocate_store_draw already prevents
# starvation) and is CELL-BOUND — leaving abandons it — but the mover never sees it
# (`diffusion_select_target` weighs only forage S). Testart 1982: delayed-return STORAGE is what makes
# foragers sedentary; you don't walk away from a full granary for a 5% better patch. Unlike `standing` (a
# RELATIVE contest weight, which cancels on an empty cell), the store is an ABSOLUTE place-bound value ⇒
# it is what actually anchors. Perceived as the per-capita stored buffer amortised over
# `store_anchor_horizon` steps. Default OFF (gain 0) ⇒ bit-exact.

[enable_provisioning]
value = true
owner = "DemographyConfig"
type  = "bool"
# Resource-Ecology Phase C.2b: mother-linked provisioning. A mother's harvest that overflows her reserve
# cap (otherwise wasted) is redirected to her dependent children (age < forage_age_min). Flow-based
# (adults at the cap have no reserve headroom to give); the variance lands on the mother's cell quality.
# Forage-only = the gathered-plant kin-sharing tier (Gurven 2004).

[enable_life_history]
value = true
owner = "DemographyConfig"
type  = "bool"
# Newborn→adult LIFE-HISTORY transition (Kaplan 2000 cooperative breeding): when ON, the model auto-uses a
# MONTH-scaled LifeHistoryConfig (forage_age_min=180=15yr, forage_age_max_offset=120=10yr) so a child's
# production (η ramp 0.2→1), maintenance (0.3→1) and reserve (0.3→1) all ramp over childhood — the graded
# juvenile deficit that provisioning covers. Fixes the gap where lh_config was never passed → newborns
# foraged at full adult rate. Pair with enable_provisioning (feed the deficit). Default OFF ⇒ no juvenile
# penalty.

[enable_condition]
value = true
owner = "DemographyConfig"
type  = "bool"
# Biome-Mortality S0: lagged body-condition / immune-competence signal. When ON, the nutrition×disease
# synergy reads a slow EMA of nutritional status (`_condition`) instead of the instantaneous (bang-bang)
# reserve — so sustained undernutrition potentiates DISEASE mortality (Pelletier), routing the seasonal
# squeeze through graded disease rather than the hard starvation floor (R-8/R-10 critical-path fix).

[enable_game]
value = true
owner = "DemographyConfig"
type  = "bool"
# Game/meat economy (the Carbon substrate; MODEL_SPEC §4.5.5, blueprint v2). The cell yield is split into
# a forage stream (household, shared at κ=0) and a meat stream (band-pooled, Cred-weighted at κ>0 — the
# status/show-off sharing of high-variance game, Kaplan & Hill 1985 / Hawkes 1991). `game_meat_frac` = the
# diet animal fraction by biome (Cordain 2000 Table 2, terrestrial-renormalized; terrain.MEAT_FRAC).
# Energy-conserving: at κ=0 forage+meat == the single stream (exact back-compat; default 0 = forage-only).

[enable_storage]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── Storage (delayed-return economy; the sedentism/inequality precursor — Testart 1982, Woodburn 1982,
# Binford 2001). FLAGGABLE. In the OVERWINTERING zone (cell mean temp ≤ storage_temp_threshold_c ≈
# Binford's Effective-Temperature 15.25 °C storage threshold) an agent banks a `storable_fraction` of its
# harvest OVERFLOW (intake above the reserve cap — otherwise wasted/given away) into a per-agent store
# (cap = store_capacity_reserves × the reserve cap), then DRAWS it down in the lean season to stay one
# step above the starvation floor. Warm/aseasonal cells never accumulate (immediate-return → egalitarian,
# by construction — Aché/Hadza/Hiwi/!Kung). Default OFF = exact back-compat. (Per-agent store is v1; the
# collective-vs-individual grain + the storage→inequality morph is the next step.)

[enable_resource_storability]
value = true
owner = "DemographyConfig"
type  = "bool"
# RESOURCE-DEPENDENT STORABILITY (Testart 1982: it's the STORABLE seasonal resources — grain, nuts, dried
# fish — that enable sedentism, NOT perishable fresh forage/meat). When enabled, storable_fraction becomes
# a per-cell weighted average of the resource mix's storabilities: Σ(resource·s_r)/Σ(resource), s_grain
# 0.85 / s_fish 0.80 / s_forage 0.15 / s_game 0.35 (STORABILITY_BY_RESOURCE). So grain/fishing cells
# accumulate granaries → sedentism/ complexity, while fresh-forage cells can't store → stay mobile (the
# Testart distinction). Default OFF ⇒ scalar, bit-exact.

[enable_aggl_ceiling]
value = true
owner = "DemographyConfig"
type  = "bool"
# R-103 STRATIFICATION-INEQUALITY GATE. The morph classifier calls a band "stratified" on high MEAN
# surplus (surplus_frac ≥ 0.7), but stratification is UNEQUAL control of surplus, not affluence —
# Testart's own chain is storage → wealth DIFFERENTIALS → heritable rank, and the level-only test skipped
# the differentials step. Diagnosed 2026-07-22: a uniformly-affluent packed world (flat-tropical) read 45%
# stratified while having the LOWEST cred-Gini of any arm (0.29) — the label ran OPPOSITE to inequality.
# When ON, a would-be stratified band must also show within-band cred concentration ≥
# `stratification_gini_min`. Default OFF ⇒ bit-exact. R-105 BUGFIX TOGGLE — the AGGLOMERATION CEILING GAP.
# Point-mode agglomeration adds a SUPERLINEAR occupancy bonus (n**aggl_a - n) to ANY occupied cell, but
# the R-63 carrying-capacity ceiling was gated on `(cx,cy) in _settlement_sites`. So a NON-settlement cell
# got unbounded increasing returns: more crowding → superlinearly more food → more people. Diagnosed
# R-104: a run sat at pop ~3000 for 1750 steps, then surplus_med saturated at 1.0 and pop went 3259→97551
# with ZERO starvation at 61 agents/cell. ON ⇒ the ceiling also applies wherever the agglomeration bonus
# is applied. Default OFF ⇒ bit-exact with every pre-R-105 result (which were all run with the gap open).

[enable_stratification_inequality_gate]
value = false
owner = "DemographyConfig"
type  = "bool"
# (no provenance comment in source — UNDOCUMENTED, worth filling in)

[enable_landscape_packing]
value = true
owner = "DemographyConfig"
type  = "bool"
# horticultural 0.27, agricultural/pastoral ~0.45–0.57 → the egalitarian↔stratified boundary sits
# ~0.35–0.40. PROVISIONAL: within-band Gini runs below whole-population Gini, so calibrate on the
# validated baseline. PACKING MEASURE (R-61 fix): the morph "packed" test vs Binford 0.091/km². Default =
# a band's members / its footprint area (a band's density over its own range ~0.017 = a NORMAL forager →
# never packs). Binford's 0.091 is a LANDSCAPE population density, so `enable_landscape_packing` uses (all
# agents on the band's cells / area) — is the LAND crowded, not is my band spread thin — so a genuinely
# dense village (rich/circumscribed terrain) can cross packing and stratify. Default OFF ⇒ old measure
# (bit-exact).

[enable_morph]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── S.4 society morph (PER-CELL): a cell that stays packed (≥ Binford packing) with a defendable storable
# surplus for ~1 generation morphs egalitarian_forager → complex_forager → stratified_chiefdom (the cell's
# κ rises → unequal store/meat sharing); it DE-morphs back when the surplus/density collapse (hysteresis
# via the settle timer). Drives `society_from_character` (which was never called). Needs enable_storage
# (the surplus signal). Default OFF = bit-exact back-compat. (v1 morphs the κ/inequality lever per cell;
# the family-knob localization — per-cell mate-choice etc. — is a follow-on, reproduction still reads the
# global config.)

[enable_economic_defensibility]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── ECONOMIC DEFENSIBILITY / OWNED-PATCH (blueprint …_EconomicDefensibility; Dyson-Hudson & Smith 1978):
# the BETWEEN-band driver of concentration. Movement is Ideal FREE Distribution → no band can monopolise a
# dense storable resource → it dilutes to the landscape average → no private surplus → no tether
# (diagnosed GATE-3 / R-51). A band that LEAD-occupies a DEFENSIBLE cell (dense × predictable resource:
# aquatic_food/S_pot ≥ defensibility_min) for defensibility_claim_dwell steps CLAIMS it; then OUTSIDERS
# perceive a reduced per-capita there (× defensibility_exclusion — the shadow of defence, so IFD routes
# them away) while OWNER members get a tether bonus (× defensibility_tether) pulling them onto their reach
# → per-capita stays high → concentration → packing → the density morph fires. Soft / no-violence v1 (a
# perception change only). Resource-agnostic (a proto-agriculture `cultivability` source drops into S_pot
# later). Needs distinct band_ids (enable_band_affiliation) to be meaningful. Default OFF ⇒ owner map is
# None ⇒ movement/split bit-exact.

[enable_improved_land]
value = true
owner = "DemographyConfig"
type  = "bool"
# IMPROVED-LAND (agriculture): cultivable land becomes DEFENSIBLE/claimable where it is actively WORKED —
# inside an active settlement's catchment — NOT merely fertile. "You own what you've cleared and planted"
# (Testart delayed- return; Bandy landscape capital). Opens the AGRARIAN territoriality → stratification
# path (Fertile Crescent/Nile) alongside the aquatic (NW-Coast) one, without letting the ~62% cultivable
# wilderness all be claimable at once. Requires enable_economic_defensibility. Default OFF ⇒ aquatic-only
# claimable (bit-exact).

[enable_aggregation_sedentism]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── AGGREGATION-SEDENTISM (blueprint …_AggregationSedentism; Mauss/Binford/Johnson): settlements as
# MULTI-BAND coalescence — "the gathering that stops dispersing". Q1 lit: villages form by COALESCENCE of
# several bands at a rich node (not one band packing); Q2: the landscape is ~6× below Binford packing, so
# the density must come from AGGREGATING bands. At a persistent-abundant site a seasonal pool (≥
# settle_min_pool people) PERSISTS: members within settle_radius are held (cohesion → site, at the POOL
# scale where it is stable) so the aggregation packs → the density morph fires; scalar stress → hierarchy.
# Dissolves (hysteresis) when the pool can't be sustained. LAYER 1 (this): lifecycle + hold,
# reside-on-cluster harvest. LAYER 2 (later): logistical CATCHMENT foraging (residence ≠ foraging; Binford
# collectors) + catchment-grain defensibility. Needs enable_marriage_aggregation (the gathering) +
# enable_band_affiliation. Default OFF ⇒ no settlements ⇒ bit-exact.

[enable_catchment_ceiling]
value = true
owner = "DemographyConfig"
type  = "bool"
# CATCHMENT CARRYING-CAPACITY CEILING (R-63): a settled village's TOTAL food (base forage + resource
# tier-2 + agglomeration social-returns) is capped at what its catchment land can sustainably yield — a
# village cannot out-produce its territory, whether by intensifying OR by specializing. This is the
# resource ceiling R-54 recorded (Bettencourt: "a subsistence village has a resource ceiling a modern city
# does not") but never applied — the fix for the UNBOUNDED point-superlinear premium (R-63). Increasing
# returns then RISE → SATURATE at the ceiling → scalar stress caps size; rich (aquatic/arable) catchments
# carry more → surplus → stratify. Default OFF ⇒ bit-exact.

[enable_settlement_scalar_stress]
value = true
owner = "DemographyConfig"
type  = "bool"
# SETTLEMENT SCALAR STRESS (Johnson 1982, dissipated by hierarchy) — the missing cost that caps VILLAGE
# size. The residence pin otherwise pulls every nearby agent into a settlement unconditionally ⇒ villages
# grow to the food ceiling with no cap (R-63). Here an over-crowded settlement REPELS agents (prob =
# size_repulsion(village_pop)) — but the repulsion is scaled by the settlement's SOCIETY factor
# (egalitarian 1.0 → complex 0.5 → stratified 0.25): hierarchy absorbs scalar stress (Johnson's thesis),
# so an EGALITARIAN village fissions at ~midpoint while a STRATIFIED one grows past it. Combined with the
# catchment ceiling this closes the loop: cap at ~150 → surplus (ceiling > pop) → morph to stratified →
# scalar stress weakens → village grows toward the ceiling. Default OFF.

[enable_tier2_shock]
value = true
owner = "DemographyConfig"
type  = "bool"
# LAYER 2b core — SHOCK (a bad-run / drought year). Fisheries don't deplete-collapse (salmon self-renews —
# NW Coast stable millennia); the real dispersal driver is a correlated bad YEAR that STORAGE must buffer.
# Once per aggregation_period a mean-preserving REGIONAL lognormal `s ~ LN(CV=shock_cv)` scales that
# year's tier-2 yield (shared across settlements — a climate bad year can't be insured away). Full
# granaries ride it out; thin ones → deficit → the existing starvation + settlement-dissolve → dispersal
# EMERGES. Anchor: salmon run inter-annual CV ~0.5–1 (ENSO/ocean regimes). Soil-depletion + learning
# (landesque capital) deferred to the cultivability tier. Default OFF ⇒ shock=1.0 ⇒ bit-exact.

[enable_agriculture]
value = true
owner = "DemographyConfig"
type  = "bool"
# AGRICULTURE TIER Layer A (blueprint …_AgricultureTier): add `cultivability` (EFC-derived,
# resource-agnostic) as a SECOND S_pot source → S_pot = max(aquatic_food, cultivability), so settlements
# form on FERTILE LAND and behave like fishery villages (the generality payoff — farming villages via one
# field). Layer B (soil-depletion + landesque + relocation → the dynastic bust) follows. Default OFF ⇒
# S_pot = aquatic_food only ⇒ bit-exact.

[enable_soil_depletion]
value = true
owner = "DemographyConfig"
type  = "bool"
# AGRICULTURE TIER Layer B1 — SOIL DEPLETION (the bust driver fisheries lack). A FARM settlement
# (cultivability > aquatic at its site) degrades a per-site SOIL stock ∈[SOIL_FLOOR,1] under farming
# pressure; tier-2 farm yield × soil. Regrowth is SLOW (swidden fallow ~10–20 yr) — depleted land only
# recovers on a long fallow (after the village leaves). FISHERIES are exempt (aquatic-dominant sites never
# deplete → R-53 stable villages preserved). This gives boom → soil-degrade → yield-fall → bust
# (relocation = Layer B3). Default OFF ⇒ soil≡1 ⇒ bit-exact.

[enable_alluvial_renewal]
value = true
owner = "DemographyConfig"
type  = "bool"
# ALLUVIAL RENEWAL — soil renewal is TERRAIN-dependent, not uniform. The annual FLOOD re-deposits nutrient
# silt, so FLOODPLAIN farmland is renewed WHILE FARMED (the Nile floodplain was cropped ~5,000 yr
# essentially without fallow — the flood WAS the fertilizer), whereas RAIN-FED dryland exhausts → the
# swidden deplete→fallow→re-settle cycle. Keyed on `wateracc`, the SAME alluvial signal
# cultivability_field already uses (CULT_WATER_BASE far-from-water = rain-fed/no alluvium …
# CULT_WATER_GAIN at the water = alluvial floodplain/irrigable = prime; Nile/Mesopotamia/Indus). ⇒ TWO
# agrarian regimes emerge: rain-fed SWIDDEN (deplete→abandon→re-settle = cycles) vs HYDRAULIC floodplain
# (renewed → stable, dense, stratifying without cycling). Requires enable_soil_depletion. Default OFF ⇒
# every farm depletes (bit-exact).

[enable_emergent_abandonment]
value = true
owner = "DemographyConfig"
type  = "bool"
# EMERGENT ABANDONMENT — a settlement's HOLD on its people is not permanent; it erodes when the village's
# REMEMBERED FORTUNES have been bad for a long time. There is NO "if soil < X then dissolve" rule and NO
# global knowledge: the agents' ordinary IFD drive already wants to move somewhere better — it is merely
# OVERRIDDEN by the residence pin. So we make the PIN condition-dependent on the site's own history (which
# is the only information the elders actually have) and let the existing drive decide: released ⇒ the
# agent stays anyway if nowhere nearby is better, or drifts out if it is → the pool falls below
# settle_min_pool → the settlement dissolves by the EXISTING rule → the field fallows → budding re-settles
# fresh land. Abandonment thus EMERGES. memory: per-SITE EMA of hardship (1 − realized field productivity)
# — attached to the PLACE (members churn, the place persists). A slow EMA ⇒ one bad year does not move it
# (natural hysteresis); only CHRONIC decline does. Fisheries/alluvial sites keep soil ≈1 ⇒ hardship ≈0 ⇒
# they never abandon (the permanent hydraulic village). ANCHOR: swidden villages relocate every ~5–30 yr
# (Conklin's "integral pioneers… move on to new village sites often"; Yanomamö ~5–10 yr) = WITHIN one
# generation, not several. Requires enable_soil_depletion. Default OFF ⇒ the pin never releases
# (bit-exact).

[enable_agglomeration]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── AGGLOMERATION ECONOMICS (the "grand unification" rework; blueprint …_AgglomerationEconomics). ONE
# idea: INCREASING RETURNS TO CO-LOCATION. Each cell's intensive catchment resource R(c) =
# aggl_tier2·Σ_catchment(S_pot· soil); a co-located group of n gets total output R·L(n) with
# L(n)=n^α/(n^α+half^α) (convex→saturating), so per-capita R·L(n)/n is SINGLE-PEAKED in n. Under IFD,
# agents then aggregate to the peak → villages/packing/optimal- size/relocation/bust all EMERGE, replacing
# the discrete settlement lifecycle. Applied CONSISTENTLY to movement (perceived) AND harvest (realized)
# so no over-subscription death. α anchored to Bettencourt ~1.15 (MODEL_SPEC §4.8.21) — SWEPT (band-scale
# at 1.15, village-scale needs sharper). Default OFF ⇒ legacy S/(n+1) ⇒ bit-exact. aggl_mode selects the
# returns-to-co-location FORM: "point" — Bettencourt-CORRECT (Branch A): the cell's OWN intensive output
# scales super-linearly with its occupancy, O(n) = A_cell·n^β, so PER-CAPITA = A_cell·n^(β-1) RISES with n
# (β>1) → co-location is genuinely more productive per head → packing NUCLEATES and reinforces GRP. A_cell
# = tier2·S_pot·cv_ref (single cell — a POINT return, not an areal sum). This is the intended
# agglomeration economy. "catchment" — FALSIFIED (kept for comparison): shared catchment pot R·L(n)/n with
# L saturating → per-capita PEAKS then CONGESTS (∝1/n at scale) → areal-dispersive, monotonically REDUCES
# packing as tier2 rises. The exponent there (aggl_alpha) is a logistic saturation-sharpness, NOT
# Bettencourt's scaling β. See DEAD_ENDS + MODEL_SPEC §4.8.21.

[enable_forage_cap]
value = true
owner = "DemographyConfig"
type  = "bool"
# PER-PERSON FORAGE CAP (the solitude fix): a forager can only WORK so much land — intake is capped at the
# biome return-rate × work hours (forage_kcal[cell] · forage_cap_hours), NOT the whole cell (S/n gave a
# lone agent ~27× subsistence → solitude over-rewarded → aggregation never paid; GATE-3). Grounds the
# economy in the Survey-A return-rate data (MODEL_SPEC §4.1; forage_kcal already a field, biome-dependent
# + right-skewed distribution). Flattens the forage per-capita (≈cap up to carrying) so
# grouping/agglomeration decide clustering. Applied in movement (perceived) AND harvest (realized).
# Default OFF ⇒ legacy S/n ⇒ bit-exact. (v2: × age-skill curve + cred-transmitted embodied capital —
# Walker 2002 / Gurven 2006 / Koster 2020, pending fetch.)

[enable_bonded_mating]
value = true
owner = "DemographyConfig"
type  = "bool"
# (storage_tether_reserves RETIRED 2026-06-29 — the band-aid that froze stocked bands in place to force
# packing; superseded by the emergent-bands grouping drives + bonded mating, which reach packing and fire
# the morph on their own. See MODEL_SPEC §4.8.5 and outputs/.../run_3h_tether_retirement.py.) F.1 bonded
# mating (emergent bands via SELECTION): a female reproduces only if her cell has a co-resident adult male
# who is NOT her own son (kin-avoidance) — a LONER cannot reproduce, so loner lineages die out and the
# population concentrates in bands by selection (not navigation). Default OFF = asexual/female-only
# (R-18/19).

[enable_band_risk]
value = false
owner = "DemographyConfig"
type  = "bool"
# F.2 band risk-dilution (safety-in-numbers on the EXOGENOUS biome hazard). The lit biome
# accident/incident rate (the terrain-risk channel, anchored on people LIVING IN BANDS —
# Hill/Hurtado/Walker 2007) is the band-level baseline; a SUB-band group loses that mitigation → elevated
# a2 mortality, SCALED by the biome's own incident rate (being alone is dangerous in a risky biome,
# ~harmless in a safe one — Hamilton 1971 selfish-herd / domain-of-danger). A full band (size ≥
# band_risk_size, summed over bonded_mate_radius) faces the anchored baseline (factor → 1, so the
# validated biome-mortality calibration is unchanged). With density-disease (which RISES with crowding)
# this was hypothesized to give an emergent OPTIMAL band size. ⚠ CAVEAT (F.2 prototype, run_3i, 2026-06-29
# — KEEP OFF): it does NOT. Mortality doesn't cause aggregation (that is the E.1 movement safety-drive's
# job); a loner-mortality penalty just CULLS the population, which lowers density → smaller bands → more
# loners → more penalty = a DEATH SPIRAL, not a stabilizing optimum (penalty 0→6: pop 281→64, mean band
# 56→5). Risk-dilution is properly expressed in MOVEMENT (E.1), and banding already has fitness teeth via
# the F.1 mate-gate. Left in (default OFF) for future experiments only.

[enable_pair_bonds]
value = true
owner = "DemographyConfig"
type  = "bool"
# F.3a/b PERSISTENT FAMILIES (the deferred "C"; core of FD-1). `enable_pair_bonds`: a female forms a
# DURABLE monogamous bond with a band male (prowess-weighted by mate_choice_strength), persisting across
# births (vs the per-conception lottery); births default to the living co-resident partner; the bond
# dissolves on partner death (→ widow re-pairs = serial monogamy) or at `divorce_rate`/step. The NUCLEAR
# FAMILY — mother + bonded father + dependent children (age < `family_maturity_months`) — MOVES AS A UNIT
# (co-locates to the mother each step); children DETACH at maturity → exogamous dispersal. Builds stable
# family-cored bands (Hill et al. 2011; Marlowe monogamy). Uses bonded_mate_radius as the band extent.
# Default OFF = bit-exact back-compat.

[enable_band_affiliation]
value = true
owner = "DemographyConfig"
type  = "bool"
# F.3c-1 BAND AFFILIATION (the collective-identity vector's band_id cell). A persistent band membership
# that families AFFILIATE into → multi-family bands (~25, Hill 2011 / Birdsell), the stable handle
# per-band society attaches to. Newborns inherit the mother's band; at marriage the incoming spouse JOINS
# the larger/richer band (FLEXIBLE/multilocal — keeps bands non-kin). A band-cohesion movement drive pulls
# family-roots toward their band's centroid (food stays dominant); emergent fission (> band_split_size) /
# fusion (< band_merge_size) with hysteresis bound band size ~25. Requires enable_pair_bonds. Default OFF
# = bit-exact back-compat.

[enable_emergent_band_size]
value = true
owner = "DemographyConfig"
type  = "bool"
# EMERGENT BAND SIZE v3 (blueprint …_EmergentBandSize; R-72). Band size = the argmax of {risk-pooling −
# competition}, per the blueprint's original spec. Two coupled changes vs v1/v2: (1) LINEAR law, no
# clamps: g* = CV/cv_safe, where CV is the local DAY-TO-DAY return CV (terrain.RETURN_CV — a temporal
# field, NOT the spatial FORAGE/GAME_KCAL_STD; see terrain.py). v1/v2 used g*=(CV/cv_safe)², which is a
# *stopping rule with no cost side* ("pool until residual CV hits a threshold") — unbounded in CV, hence
# the clamps, hence saturation at 15/45 with nothing in between. The linear form falls out of
# benefit-vs-cost: pooled variance falls as σ²/n while crowding cost rises with n, so the optimum is n* ∝
# CV. It needs no clamps, and a 2× CV spread gives a 2× band spread — which is what the ethnography shows
# (Marlowe/Kelly 25–50). (2) The CV drives the COST side. v1/v2 only lowered the fission *ceiling*, i.e. a
# permission to be big — measured corr(g*, band size) = −0.22, no gradient, because a ceiling cannot pull
# a band together. `repulsion_midpoint` (Johnson scalar stress) is the term that actually sets band size,
# and it was still hardcoded at 25 — which is why R-64's "band ≈ 24" came out at 24. It is now per-band =
# g*(CV), so a high-variance band tolerates crowding longer before scalar stress bites. This deletes
# band_size_min, cv_min, and the two hardcoded 25s from the ON path (band_base_tolerable and
# repulsion_midpoint survive only as the default-OFF values ⇒ bit-exact back-compat).

[enable_dynamic_bands]
value = true
owner = "DemographyConfig"
type  = "bool"
# F.3c-3 DYNAMIC fission/fusion + the ASSABIYAH seam (Ibn Khaldun group solidarity). Instead of a hard
# split at band_split_size, a band fissions only above its CONDITION-DEPENDENT `tolerable_size` = base +
# (hard_cap − base)·assabiyah — so a rich, high-solidarity band STAYS TOGETHER larger; a poor one fissions
# at the base. `assabiyah` (the GroupVector seam, now active) builds from the band's SURPLUS (success →
# solidarity, +gain· surplus) and decays (−decay) — a per-band cohesion state, mirrored onto members'
# GroupVector. band_split_size stays the absolute runaway cap; band_merge_size the viability floor.
# Requires enable_band_affiliation.

[enable_leader_coherence]
value = true
owner = "DemographyConfig"
type  = "bool"
# (RETIRED 2026-07-01, DE-7: `season_aggregation` coupled tolerable_size to seasonal abundance →
# lean-season fission. Mis-signed (moderate lean should not fission) + inert (dormant threshold, R-31).
# Superseded by M2 malnutrition fission. Field removed; configs that set it will now error — intended, it
# is retired.) Social-Evolution Stage 1: LEADER COHERENCE (a SECOND, distinct cohesion source added to
# `tolerable_size`, additive alongside assabiyah, not a relabel). A band's top-status member (highest
# cred·prowess) lends extra cohesion, scaled by a Boehm 1999 reverse-dominance GATE on the band's society
# type (egalitarian bands LEVEL would-be leaders → weight≈0; complex/stratified bands institutionalize
# authority → weight rises). Read FRESH every step from current membership (no accumulated state, unlike
# assabiyah) so the benchmark signature — leader death/removal → an IMMEDIATE cohesion drop → a fission
# spike next check — is not smoothed by a decay lag. Requires enable_dynamic_bands (the term feeds the
# same tolerable_size headroom). Default OFF = bit-exact (leader_term≡0 regardless of gain when the flag
# is off).

[enable_size_repulsion]
value = true
owner = "DemographyConfig"
type  = "bool"
# Social-Evolution Stage 1b: SIZE-DRIVEN REPULSION (Johnson 1982 scalar stress) — a DISPERSIVE
# counterweight to cohesion, rising with band size N via a logistic (Alberti 2014 shape), SUBTRACTED from
# the cohesion_frac so a large band needs MORE cohesion (assabiyah+leader) to stay whole. DISTINCT from
# the existing resource- scarcity fission (that runs through assabiyah↓ when surplus is low; this is
# resource-INDEPENDENT, purely coordination cost). Boehm/Johnson coupling: scalar stress is what
# organizational HIERARCHY exists to absorb, so the repulsion is scaled by REPULSION_SOCIETY_FACTOR — FULL
# in egalitarian mobile bands (no hierarchy → capped ~small), RELIEVED in complex/stratified (settling +
# institutions let a group grow toward the hard cap). The midpoint is the band-scale scalar-stress onset
# (≈ the Wobst-minimal band); the width is Alberti's logistic shape re-anchored to band scale
# (village-scale N≈127 → band scale — a bracket, not a fit, cf. the regime °C→CC% re-anchoring). Requires
# enable_dynamic_bands. Default OFF ⇒ repulsion≡0, bit-exact. Johnson 1982 scalar stress as a dispersive
# term. **The anchor is Alberti 2014** (PLoS ONE 9(3):e91510), who fits P(critical scalar stress |
# community size n) by logistic regression on archaeological + ethnographic cases: `logit = b0 + b1·n`
# with **b0 = −18.636** (SE 3.127) and **b1 = 0.147** (SE 0.025), both p<0.001; 98% correctly classified,
# Somers' D 0.99. Equivalently midpoint = −b0/b1 = **126.9** (95% CI 121.9–131.9) and width = 1/b1 =
# **6.80**. Cross-check: p=0.99 at n=158.2 ⇒ logit 4.62 ✓. ⇒ ANCHORED VALUES: `repulsion_gain = 1.0`
# (Alberti's logistic IS a probability ∈ [0,1] — any gain<1 arbitrarily attenuates it) and
# `repulsion_width = 6.80`. **CAVEAT (R-72):** Alberti's 126.9 is a COMMUNITY — i.e. the VILLAGE rung
# (Bar-Yosef 50–150, which `enable_settlement_scalar_stress` uses; R-63/R-64) — NOT the ~25 band. Applying
# his slope at band scale extrapolates below his data. **The validated village stack
# (`emergent_village_demog`, R-54…R-64) runs gain=0.3 + width=6.0** — i.e. a 0.3 attenuation and a rounded
# width. Left as-is: those results are validated at those values, and testing gain=1.0 did NOT rescue the
# band gradient (+0.335 → +0.374 paired, still n.s.), so re-running the village stack would buy
# documentation tidiness at the cost of re-validating R-54…R-64.

[enable_malnutrition_fission]
value = true
owner = "DemographyConfig"
type  = "bool"
# Resource-response redesign (blueprint …_ResourceResponse_Scoping): M2 — MALNUTRITION FISSION: a band
# losing members to REALIZED starvation adds a DISPERSIVE term that lowers tolerable_size toward
# band_base_tolerable → a large band breaks up (fission), the child band diffuses apart → lower local
# density → higher per-capita yield → the subsequent starvation mortality relaxes (dispersal SUBSTITUTES
# for further death). REACTIVE, not a forecast (supervisor: real bands disperse when starvation actually
# bites, not on anticipation — anticipatory dispersal would be a future "wise leadership" feature). Signal
# = an EMA of the band's per-capita starvation-death rate (`_band_starv_ema`); NOT `_condition` (which
# samples the post-harvest FED reserve → pinned ~1.0 under scarcity, survivor-biased — see RESULTS R-32).
# Intrinsically size-gated: tolerable floors at band_base_tolerable, so only bands LARGER than it can
# fission (small bands just shrink/die). Default OFF.

[enable_resource_directed_fusion]
value = true
owner = "DemographyConfig"
type  = "bool"
# F — RESOURCE-DIRECTED FUSION: a band below band_merge_size joins the RICHEST nearby neighbour (highest
# `_band_surplus`) instead of the NEAREST — starving remnants merge into well-provisioned bands (Wiessner
# hxaro). Bounded to `fusion_search_radius` cells (stay local; fall back to nearest if none in range).
# Default OFF ⇒ nearest-neighbour join, bit-exact.

[enable_village_scaling]
value = true
owner = "DemographyConfig"
type  = "bool"
# Stage 1 (village-nucleation arc) — SUPRA-BAND SCALING: band_split_size is normally a HARD cap
# (cohesion_frac clamped to [0,1] ⇒ tolerable ≤ band_split_size). Johnson 1982: a group exceeds
# scalar-stress-limited band scale ONLY when payoff + HIERARCHY overcome scalar stress. When enabled, net
# payoff ABOVE saturation (the UNCLAMPED assabiyah + leader − repulsion − malnutrition, minus 1) adds
# village HEADROOM beyond the hard cap: tolerable = base + (cap−base)·min(1,net) +
# village_gain·(cap−base)·max(0, net−1). Since assabiyah alone caps at 1 (= the hard cap exactly),
# exceeding band scale REQUIRES the leader/hierarchy term (enable_leader_coherence) — villages need
# leadership (Johnson/Testart). Default OFF ⇒ hard cap, bit-exact.

[enable_village_budding]
value = true
owner = "DemographyConfig"
type  = "bool"
# VILLAGE BUDDING (Bandy 2004; Chagnon 1975) — the ethnographic settlement-SPREAD/recovery mode. A village
# (band_id) grown past a scalar-stress FISSION THRESHOLD sheds its RIVAL-LEADER (2nd-largest lineage)
# faction, which RELOCATES to a nearby available STORABLE site and founds a DAUGHTER village. So the
# settlement system propagates by BUDDING (not by aggregating scattered individuals — the mode
# aggregation-only lacked, R-68) and re-spreads after a crash. Fission CEASES once a village STRATIFIES
# (integrative institutions suppress it — Bandy → the Carneiro fork). If no open site is in reach
# (CIRCUMSCRIPTION → high relocation cost), budding fails and the village stays large (existing morph →
# hierarchy handles it). Requires enable_band_affiliation. Default OFF ⇒ no-op (bit-exact).

[enable_bud_hazard]
value = false
owner = "DemographyConfig"
type  = "bool"
# ── EMERGENT FISSION HAZARD (2026-07-27) ──────────────────────────────────────────────────────── Fission
# is no longer a size THRESHOLD but a per-village-per-step HAZARD. Bandy 2004 is explicit that the
# threshold is not a constant — "if the cost of fissioning is low ... fissioning may be expected to occur
# frequently and at a VERY LOW population threshold" — and that the outcome is a RACE: Johnson's growth →
# conflict resolves "in only one of two ways: (1) the village fissions or (2) institutions ... emerge ...
# in such a way that fissioning is not necessary", the latter opening the way to "greater social group
# sizes, and spiraling social inequality". A village whose economy works therefore does NOT split, and
# large stable centres become an OUTCOME rather than something suppressed by hand. OFF ⇒ the old
# size-threshold path, bit-exact

[enable_wealth_obligation]
value = true
owner = "DemographyConfig"
type  = "bool"
# default OFF ⇒ bit-exact

[enable_site_appraisal]
value = true
owner = "DemographyConfig"
type  = "bool"
# Stage 1b — TERRAIN-DEPENDENT MOVEMENT COST: relocating burns energy scaled by terrain difficulty (the
# terrain `cost` field ∈[0.15,1], slope/elev-driven, water=1). Realized cost = move_cost_kcal·cost[dest]
# DRAINED at metabolism (moving repeatedly depletes reserve → selection for sedentism) AND PERCEIVED in
# the IFD utility (agents prefer to stay / take cheap-terrain steps → central-place foraging, prime
# real-estate valued). Locomotion was previously FREE (move_cost_flat=0, fixed per-step BURN). Default OFF
# ⇒ no move cost, bit-exact. Stage 1c — CATCHMENT SITE-APPRAISAL (Kennett-Winterhalder IFD-suitability +
# Vita-Finzi catchment + Orians-Pearson central place): a static per-cell SITE-VALUE field = Σ_{catchment}
# S_pot(c')·exp(−λ·dist·(0.5+cost(c'))) — the resource potential of the surrounding catchment DISCOUNTED
# by cost-distance (rugged/far cells contribute less). Normalized [0,1], scaled by site_gain·BURN,
# PERCEIVED in the IFD utility (occupancy-independent). This gives a GLOBAL gradient that agents climb
# toward prime central places → solves the ASSEMBLY problem (converge on best catchment, not coordinate) +
# values prime real-estate + tightens communities onto catchment cores. Perceived-only (anticipation) —
# actual food is still forage cap + point-superlinear + storage (no double-count). Default OFF ⇒
# bit-exact.

[enable_terrain_move_cost]
value = true
owner = "DemographyConfig"
type  = "bool"
# (no provenance comment in source — UNDOCUMENTED, worth filling in)

[enable_genealogy_log]
value = false
owner = "DemographyConfig"
type  = "bool"
# CALIBRATED ~750 (≈0.01·BURN): a ~10 km residential move costs a human ~50–75 kcal/km × 10 km ≈ 500–750
# kcal (locomotion energetics). This is BOTH the physical scale AND the beneficial sweet spot: at 750
# packing 25.7→30.3%, max/cell 25.7→32, pop healthy (430); ABOVE it over-penalizes (per-step movement IS
# essential foraging → starves marginal agents; 0.1·BURN collapses pop). [VERIFIED-anchored to walking
# energetics; sweep-confirmed non-lethal window.] Social-Evolution Stage 2: GENEALOGY LOGGER — opt-in
# append-only logging of each birth/death (uid, mother, father, lineage, band_id, step, cred) to an
# in-memory flat buffer (O(births+deaths); dump to disk offline). A PURE OBSERVER: writes AFTER the step,
# reads nothing back, never touches the RNG or dynamics (bit-exact). The analytic substrate for Stage 3
# (lineage-extinction curves, dynasty depth vs assabiyah, who-fathered-whom).

[enable_ascribed_mate_choice]
value = true
owner = "DemographyConfig"
type  = "bool"
# Ascribed-status mate-choice (blueprint …_AscribedMateChoice): let cred (ascribed lineage) earn a mating
# advantage, SOCIETY-GATED (Boehm) — ≈0 egalitarian, rising complex→stratified. Mate weight interpolates
# from prowess (egalitarian) to base_status=cred·prowess (stratified): w = (prowess ·
# cred^(a·sw))^mate_choice_strength. Fixes the composite status→RS ~0 (R-35: cred had no mating channel).
# Default OFF ⇒ prowess-only, bit-exact.

[enable_marriage_aggregation]
value = true
owner = "DemographyConfig"
type  = "bool"
# Seasonal MARRIAGE-AGGREGATION ("the gathering"; blueprint …_MarriageAggregation): dispersed bands
# converge on abundant sites in the abundance window; unpaired adults pair ACROSS bands (regional
# connubium) → durable bonds; then disperse. Fixes the low-density mate-gate collapse (R-37) — families
# form in every biome via a regional marriage network (Wobst/Steward/Lee), not a daily within-camp
# mate-gate. When ON, the daily `_do_pairing` is REPLACED by the periodic gathering; births still gate on
# the persistent pair-bond year-round. Default OFF ⇒ daily within-band pairing, bit-exact.

[enable_genome]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── Neutral-marker GENOME (population genetics: relatedness, inbreeding, effective pop size Nₑ, drift). A
# DIAGNOSTIC substrate, NOT the marriage rule — forager exogamy is cultural (lineage/clan; see connubium).
# Founders seeded with distinct alleles; children inherit each locus Mendelian ½/½. genome.py. Default OFF
# ⇒ no genome carried, bit-exact.

[enable_lineage_branching]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── LINEAGE BRANCHING (R-90). `_lineage` (the named patriline/patriclan — the exogamy unit AND the
# dynasty unit) was founder-seeded and only ever LOST by extinction, never created: an ABSORBING process
# that fixates with probability 1. Measured (R-89): 3000 founding lines drifted to 5 by step 1950 and
# stuck there, which (a) breaks the FILED Hill-2011 target of ~7 lineages/band + dominant-lineage share
# 0.38 that R-25 already passed, and (b) freezes the elite layer, since with no non-ascribed lineage left
# the gumsa→gumlao reversion cannot fire. Real named descent groups both die AND branch. Same
# INFINITE-ALLELE device genome_mutation already uses. Deliberately NOT size-triggered segmentation:
# capping lineage size would make `top_share` an artifact of the cap, destroying the very statistic T-9
# measures against Zerjal/Yan. Rate 0.0 ⇒ no RNG draw ⇒ bit-exact.

[enable_rank_hierarchy]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── LINEAGE SEGMENTATION (R-92) — the CORRECTED SHAPE of the above. Per-birth branching mints SINGLETONS,
# and a lineage of one usually leaves no descendants, so it adds a churning tail of ephemeral names that
# inflates the COUNT while the dominant line keeps its mass untouched. Measured (R-90, campaign scale):
# n_lineages 5→32 but eff_lineages (inverse-Simpson) FELL 3.4→1.8 and top_share ROSE 0.42→0.73 — diversity
# up on paper, down in substance, and lineages_per_band barely moved (2.14→2.33 against a target of ~7).
# Real Y-haplogroup trees do not sprout singletons at the tip; an existing line SEGMENTS into sub-clades
# that inherit real membership. So: pick a living member as the apical ancestor and split off ALL of its
# live patrilineal descendants as a new named line. Both halves are viable and both stay spread across
# bands, which is what lifts per-band diversity toward the Hill 2011 target. NB this is NOT the
# size-CAPPED segmentation rejected in R-90: hazard scales with size (a Yule process, which is what
# generates realistic skewed haplogroup distributions) but nothing bounds a lineage's size, so `top_share`
# stays a free measurement rather than an artifact of a threshold. ── RELATIVE legitimacy (R-93) —
# `legit_threshold` compares a lineage's SHARE of its band's feasting to a CONSTANT, and a share has a
# hidden denominator: the mean share is 1/lineages_per_band, so the test only discriminates while
# lineages_per_band > 1/legit_threshold. At the campaign's 0.15 that boundary is 6.67, against a Hill 2011
# target of ~7 — a FIVE PERCENT margin. Nobody changed the parameter; the substrate drifted under it
# (measured lpb 2.14-3.69), at which point the AVERAGE lineage clears the bar and "nobility" becomes
# universal by arithmetic rather than by competition. R-92 confirmed a healthier substrate does NOT rescue
# it: the DOMAIN violation still fires at step ~650 with segmentation on. Fix: normalise the share by the
# number of lineages actually competing in that band, so the stored stock is a RELATIVE share where 1.0
# means "exactly an average lineage" — scale-free, and Friedman's logic anyway ("one lineage convinces all
# the others" is about standing out from your neighbours, not clearing a fixed bar). ── SCALE-FREE
# resentment (R-94) — the SAME bug class as legit_threshold, one layer down. Privilege was
# `(mean_cred_ascribed − mean_cred_other)/mean_cred_other ÷ resent_privilege_ref`, with ref=10.0 chosen
# while ascription was UNIVERSAL and cred saturated toward 1+legit_cred_gain=11. Once R-93 made nobility a
# real 6% minority the gap shrank, privilege peaked at 0.166 against a 0.5 threshold, and reversions NEVER
# fired (0 vs 5,741). The reverse mechanism had been tuned against the BROKEN forward mechanism, so
# repairing the forward one moved the regime out from under it. Per charter D15, the fix is a scale-free
# measure rather than a re-tuned constant: privilege becomes an EFFECT SIZE — the noble/commoner cred gap
# divided by the band's own pooled spread — which has no denominator left to drift AND lets the threshold
# be anchored on Cohen's conventions (0.2 small / 0.5 medium / 0.8 large) instead of invented. ──
# RESENTMENT AS A TRUE ACCUMULATOR, HELD BY THE VILLAGE (R-95). Two flags, separable but ENTANGLED —
# neither works alone, and there is a test asserting exactly that. (a) ACCUMULATOR. `_do_delegitimation`'s
# own docstring says in capitals that resentment ACCUMULATES, after Leach — *"prestige-seeking only
# increased their followers' resentment and hastened their overthrow"*. The code implemented an EMA, which
# does not accumulate: it TRACKS, converging to whatever it is fed. So a threshold at or above the typical
# privilege can NEVER be crossed at any horizon. Measured (R-94): the grudge rose to 0.796 against a
# threshold of 0.800 and stopped — 1 revolt in 3000 years. Accumulating instead makes the TIME-TO-REVOLT
# the anchored quantity, which is what Leach actually claims, and removes the threshold as a free
# parameter (it is fixed at 1.0 by construction). (b) VILLAGE UNIT. R-88 measured band lifetime at 10.2 yr
# median / 17.5 mean, while the grudge needed 700-1600 yr to mature — the memory outlived its container by
# ~40-100x, and band fission resets it to zero. Leach's gumlao premises describe VILLAGES ("villages
# autonomous", headmen, councils of elders), not 25-person residential bands, so the settlement is both
# the lit-correct unit AND the one that persists. Follows R-71's per-SITE precedent exactly: the place
# remembers, the members churn. ── LOCAL ascription (R-96). `_lineage_ascribed` was a GLOBAL set while
# every mechanism acting on it is LOCAL, so one village's revolt de-ranked that lineage in EVERY other
# village at once. Measured (R-95): ~7% of all lineages stripped per revolt, and nobility went from 82% of
# villages to 3% — annihilated rather than cycled. It contradicts the anchor directly: Leach's observation
# is that communities sit in DIFFERENT states simultaneously ("shifting back and forth"), which a single
# global set cannot represent. With this on, rank is held per (community, lineage): a lineage is noble IN
# A PLACE, and a revolt touches only the community that revolted. The community is the settlement when
# village resentment is on, else the band. Rank is NOT portable — a family that moves must earn standing
# where it arrives, which is what "villages autonomous" implies. ── RANK UNLOCKS HIERARCHY (R-98).
# `society_from_character(density, surplus_frac)` decides a band's society from CROWDING and SURPLUS only
# — it never asks whether anyone is actually ranked. So a village where every lineage is hereditary
# nobility is still labelled `egalitarian_forager` if it is sparse and poor, and since
# LEADER_SOCIETY_WEIGHT is 0.0 there, its nobility has NO structural consequence: it cannot grow past the
# band cap, sheds no scalar stress, and the whole elite layer is decorative with respect to settlement
# size. The model has surplus→hierarchy but not rank→hierarchy. THE ANCHOR SAYS RANK CAN COME FIRST.
# Leach's gumsa were rain-fed SWIDDEN HILL FARMERS without a storable glut — no aquatic gate, no great
# surplus — yet had ranked lineages, chiefs, tribute, and "all settlements under one chief". Testart's
# preconditions are one route to hierarchy, not the only one. So a band holding ranked lineages is
# promoted ONE rung on the ladder, and deliberately only one: this opens the route, it does not hand out
# chiefdoms.

