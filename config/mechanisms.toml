[enable_village_identity]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── VILLAGE IDENTITY: co-residence dissolves band identity (2026-08-12) ────────────────────────────────
# THE GAP THIS FILLS. Birdsell's nesting is already filed in LITERATURE.md — band ~25 → horde/local group
# ~40 → dialectal tribe ~500 — and the model implements ONLY the band level. Nothing above it exists, so
# co-residence has no effect on identity anywhere in the code. MEASURED consequence: a 204-person
# settlement contains **45 distinct bands** of ~4-5 co-resident members each. A "village" is a spatial
# coincidence of strangers, not a community, which is why every fission-cleavage rule tested returns a 1-4
# person splinter (see the budding investigation, 2026-08-12). `_maintain_bands` cannot do this: its
# FUSION branch fires only below `band_merge_size` (10), a rescue rule for dying remnants. Bands sit at
# equilibrium between merge 10 and split 45 and never combine. THE RULE. An agent accrues co-residence at
# whichever settlement it is within `settle_radius` of (the model's own `_nearest_settlement`). Past
# `village_identity_months` it adopts that village's identity. Leaving resets the clock — so this is
# per-agent tenure, not a global timer, and it degrades gracefully when a settlement dissolves. THE
# TIMESCALE IS THE MODEL'S OWN COMING-OF-AGE CONSTANT, not a new number: 180 months = 15 yr =
# `menarche_months`. Mechanism — identity is inherited at birth, so a merged identity consolidates when
# the first cohort born after aggregation reaches adulthood. Half a generation (the model's mean age at
# reproduction is ~28 yr from the Table 8.2 schedule). Supervisor decision 2026-08-12, after the
# alternatives (~1 yr Wiessner hxaro = a DYADIC partnership, wrong quantity; ~28 yr full generation =
# slower than the 42-yr window in which the settlement bifurcation is decided) were costed.

[enable_bud_site_separation]
value = false
owner = "DemographyConfig"
type  = "bool"
# ── BUD SITE SEPARATION: a daughter village's catchment must not overlap its parent's (2026-08-12) ─────
# THE ASYMMETRY. `_maintain_settlements` holds a site while >= `settle_min_pool` (40) people are inside
# its (2·settle_radius+1) = 5-cell block, but budding only required a daughter 3 cells away. Two sites 3
# apart share 10 of their 25 catchment cells, so each counts the OTHER's residents toward its own survival
# test. MEASURED: ~110 settlements at mean spacing 3.79 cells, mean on-site occupancy 15.8 against a
# 40-person requirement — individually unviable sites propping each other up. Combined with a fission
# cleavage that sheds a median of TWO people (the kinship comparison excludes the 97% who are
# equidistant), every micro-splinter founded a settlement that survived on its neighbours. That is the
# budding runaway. ON ⇒ minimum separation 2·settle_radius+1, so catchments are DISJOINT and a daughter
# must hold its own pool. Default OFF ⇒ bit-exact.

[enable_exclusive_village_membership]
value = false
owner = "DemographyConfig"
type  = "bool"
# ── EXCLUSIVE VILLAGE MEMBERSHIP: settlement spacing becomes EMERGENT (2026-08-12) ─────────────────────
# THE SAME DEFECT, TREATED AT ITS CAUSE INSTEAD OF ITS GEOMETRY. `_maintain_settlements` counts every
# person inside a site's (2*settle_radius+1) window, and those windows overlap whenever sites are closer
# than that, so neighbouring villages each count the SAME people toward their own survival threshold. ON
# => each agent is counted for exactly ONE village, the nearest. Villages COMPETE for members rather than
# sharing them, so a village sited too close to another cannot assemble its own pool and dissolves.
# SPACING IS THEN AN OUTCOME, NOT A CONSTANT -- supervisor directive 2026-08-12, "we need that distance
# emergent", after the geometric rule above was found to hard-code 5 cells = 50 km against a filed anchor
# of ~20 km for disjoint forager catchments (Vita-Finzi & Higgs 1970: ~10 km site exploitation radius, the
# two-hour walk; Lee's !Kung agree). `enable_bud_site_separation` is retained default-OFF purely as the
# ablation control for "geometry alone" vs "competition". Default OFF => bit-exact.

[enable_emergent_village_founding]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── EMERGENT VILLAGE FOUNDING: one rule for every village (supervisor spec 2026-08-12) ─────────────────
# "They travel until they find a suitable place for a village that is more attractive than being a roving
# band -- just like any village forms. So a fitting cell with proto-ag or fishing potential, out of
# catchment range of other villages." Replaces the ranked-candidate scan, which was measured to be a
# MAP-COVERAGE parameter wearing a spacing parameter's name: it sorts storable cells by S_pot descending
# and stops at 40, so `aggregation_site_sep` governed how much of the map was eligible. At sep=2 (20 km,
# the ethnographic value) all 40 candidates sat in a 9x79 sliver of the single best ridge and ZERO
# villages formed. Founding is now evaluated where people ACTUALLY ARE: fitting cell + settle_min_pool
# within settle_radius + outside every existing village's catchment (anchored to settle_catchment_radius =
# Vita-Finzi & Higgs 1970's ~10 km forager site exploitation territory, [VERIFIED]). No candidate list, no
# site cap, no separation constant.

[enable_bud_requires_occupancy]
value = false
owner = "DemographyConfig"
type  = "bool"
# ── BUD-FOUNDING BYPASS REMOVED: settlement founding is occupancy-gated for EVERY path (2026-08-12) ────
# `_found_settlements_by_occupancy` already requires settle_min_pool (40) people within settle_radius
# before a settlement exists -- an emergent, occupancy-gated rule. Budding SKIPPED it and created a site
# outright, so a faction of TWO (the measured median: the kinship cleavage excludes the 97% of villagers
# equidistant from both leaders) founded a full settlement. ~1,700 settlements manufactured out of pairs
# of people in 400 steps. That asymmetry is the generator of the runaway, and no downstream rule could
# absorb it -- five were built and measured, all five failed (min-faction share silenced budding entirely;
# village identity was inert against the churn; parent-only separation changed nothing; global separation
# worked but imposed 50 km against a ~20 km filed anchor, Vita-Finzi & Higgs 1970; exclusive membership
# raised churn rather than spacing). ON => a bud RELOCATES its faction and splits the band, but founds NO
# site. The daughter becomes a settlement only where people actually gather, via the rule every other path
# already obeys. Settlement SPACING IS THEN EMERGENT and no distance constant exists anywhere in the model
# -- supervisor directive 2026-08-12, "we need that distance emergent". This REMOVES a rule rather than
# adding one. Default OFF => bit-exact.

[enable_storage]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── Storage (delayed-return economy; the sedentism/inequality precursor — Testart 1982, Woodburn 1982,
# Binford 2001). FLAGGABLE. In the OVERWINTERING zone (cell mean temp ≤ storage_temp_threshold_c ≈
# Binford's Effective-Temperature 15.25 °C storage threshold) an agent banks a `storable_fraction` of its
# harvest OVERFLOW (intake above the reserve cap — otherwise wasted/given away) into a per-agent store
# (cap = store_capacity_reserves × the reserve cap), then DRAWS it down in the lean season to stay one
# step above the starvation floor. Warm/aseasonal cells never accumulate (immediate-return → egalitarian,
# by construction — Aché/Hadza/Hiwi/!Kung). Default OFF = exact back-compat. (Per-agent store is v1; the
# collective-vs-individual grain + the storage→inequality morph is the next step.)

[enable_resource_storability]
value = true
owner = "DemographyConfig"
type  = "bool"
# RESOURCE-DEPENDENT STORABILITY (Testart 1982: it's the STORABLE seasonal resources — grain, nuts, dried
# fish — that enable sedentism, NOT perishable fresh forage/meat). When enabled, storable_fraction becomes
# a per-cell weighted average of the resource mix's storabilities: Σ(resource·s_r)/Σ(resource), s_grain
# 0.85 / s_fish 0.80 / s_forage 0.15 / s_game 0.35 (STORABILITY_BY_RESOURCE). So grain/fishing cells
# accumulate granaries → sedentism/ complexity, while fresh-forage cells can't store → stay mobile (the
# Testart distinction). Default OFF ⇒ scalar, bit-exact.

[enable_aggl_ceiling]
value = true
owner = "DemographyConfig"
type  = "bool"
# R-103 STRATIFICATION-INEQUALITY GATE. The morph classifier calls a band "stratified" on high MEAN
# surplus (surplus_frac ≥ 0.7), but stratification is UNEQUAL control of surplus, not affluence —
# Testart's own chain is storage → wealth DIFFERENTIALS → heritable rank, and the level-only test skipped
# the differentials step. Diagnosed 2026-07-22: a uniformly-affluent packed world (flat-tropical) read 45%
# stratified while having the LOWEST cred-Gini of any arm (0.29) — the label ran OPPOSITE to inequality.
# When ON, a would-be stratified band must also show within-band cred concentration ≥
# `stratification_gini_min`. Default OFF ⇒ bit-exact. R-105 BUGFIX TOGGLE — the AGGLOMERATION CEILING GAP.
# Point-mode agglomeration adds a SUPERLINEAR occupancy bonus (n**aggl_a - n) to ANY occupied cell, but
# the R-63 carrying-capacity ceiling was gated on `(cx,cy) in _settlement_sites`. So a NON-settlement cell
# got unbounded increasing returns: more crowding → superlinearly more food → more people. Diagnosed
# R-104: a run sat at pop ~3000 for 1750 steps, then surplus_med saturated at 1.0 and pop went 3259→97551
# with ZERO starvation at 61 agents/cell. ON ⇒ the ceiling also applies wherever the agglomeration bonus
# is applied. Default OFF ⇒ bit-exact with every pre-R-105 result (which were all run with the gap open).

[enable_society_regional_density]
value = true
owner = "DemographyConfig"
type  = "bool"
# SOCIETY CLASSIFIER ON REGIONAL DENSITY (R-106, 2026-08-24). The morph classifier asks "is this band
# packed past Binford's threshold?" -- and Binford's 0.091/km2 is a REGIONAL figure (persons per 100 km2
# of RANGE). The classifier was fed the band's members over its OCCUPIED cells, which is a LOCAL density:
# a band crowded onto 1.9 cells reads 0.167/km2 = 1.8x packing = STRATIFIED, while the same population
# over its true range is 0.025/km2 = 0.28x packing = egalitarian. Because the model crowds everyone onto
# ~14% of the land (the packing paradox), EVERY band read as packed, 57% came out stratified in a pure
# forager world, SEDENTISM_IBI_MONTHS gave chiefdoms a 14-month refractory, and TFR ran ~10 against a 5-8
# anchor. This is a UNITS error: local density fed to a threshold defined regionally. When on, the
# classifier density = members / (habitable_km2 / n_bands) -- the band's fair share of the whole range,
# which equals the true regional density and is the scale Binford's number means. The DISEASE hazard
# (density_disease) still uses LOCAL per-cell density, correctly: contagion is a local quantity. Default
# OFF => bit-exact.

[enable_stratification_inequality_gate]
value = false
owner = "DemographyConfig"
type  = "bool"
# (channel note, inherited) SOCIETY CLASSIFIER ON REGIONAL DENSITY (R-106, 2026-08-24). The morph
# classifier asks "is this band packed past Binford's threshold?" -- and Binford's 0.091/km2 is a REGIONAL
# figure (persons per 100 km2 of RANGE). The classifier was fed the band's members over its OCCUPIED
# cells, which is a LOCAL density: a band crowded onto 1.9 cells reads 0.167/km2 = 1.8x packing =
# STRATIFIED, while the same population over its true range is 0.025/km2 = 0.28x packing = egalitarian.
# Because the model crowds everyone onto ~14% of the land (the packing paradox), EVERY band read as
# packed, 57% came out stratified in a pure forager world, SEDENTISM_IBI_MONTHS gave chiefdoms a 14-month
# refractory, and TFR ran ~10 against a 5-8 anchor. This is a UNITS error: local density fed to a
# threshold defined regionally. When on, the classifier density = members / (habitable_km2 / n_bands) --
# the band's fair share of the whole range, which equals the true regional density and is the scale
# Binford's number means. The DISEASE hazard (density_disease) still uses LOCAL per-cell density,
# correctly: contagion is a local quantity. Default OFF => bit-exact.

[enable_landscape_packing]
value = true
owner = "DemographyConfig"
type  = "bool"
# horticultural 0.27, agricultural/pastoral ~0.45–0.57 → the egalitarian↔stratified boundary sits
# ~0.35–0.40. PROVISIONAL: within-band Gini runs below whole-population Gini, so calibrate on the
# validated baseline. PACKING MEASURE (R-61 fix): the morph "packed" test vs Binford 0.091/km². Default =
# a band's members / its footprint area (a band's density over its own range ~0.017 = a NORMAL forager →
# never packs). Binford's 0.091 is a LANDSCAPE population density, so `enable_landscape_packing` uses (all
# agents on the band's cells / area) — is the LAND crowded, not is my band spread thin — so a genuinely
# dense village (rich/circumscribed terrain) can cross packing and stratify. Default OFF ⇒ old measure
# (bit-exact).

[enable_morph]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── S.4 society morph (PER-CELL): a cell that stays packed (≥ Binford packing) with a defendable storable
# surplus for ~1 generation morphs egalitarian_forager → complex_forager → stratified_chiefdom (the cell's
# κ rises → unequal store/meat sharing); it DE-morphs back when the surplus/density collapse (hysteresis
# via the settle timer). Drives `society_from_character` (which was never called). Needs enable_storage
# (the surplus signal). Default OFF = bit-exact back-compat. (v1 morphs the κ/inequality lever per cell;
# the family-knob localization — per-cell mate-choice etc. — is a follow-on, reproduction still reads the
# global config.)

[enable_economic_defensibility]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── ECONOMIC DEFENSIBILITY / OWNED-PATCH (blueprint …_EconomicDefensibility; Dyson-Hudson & Smith 1978):
# the BETWEEN-band driver of concentration. Movement is Ideal FREE Distribution → no band can monopolise a
# dense storable resource → it dilutes to the landscape average → no private surplus → no tether
# (diagnosed GATE-3 / R-51). A band that LEAD-occupies a DEFENSIBLE cell (dense × predictable resource:
# aquatic_food/S_pot ≥ defensibility_min) for defensibility_claim_dwell steps CLAIMS it; then OUTSIDERS
# perceive a reduced per-capita there (× defensibility_exclusion — the shadow of defence, so IFD routes
# them away) while OWNER members get a tether bonus (× defensibility_tether) pulling them onto their reach
# → per-capita stays high → concentration → packing → the density morph fires. Soft / no-violence v1 (a
# perception change only). Resource-agnostic (a proto-agriculture `cultivability` source drops into S_pot
# later). Needs distinct band_ids (enable_band_affiliation) to be meaningful. Default OFF ⇒ owner map is
# None ⇒ movement/split bit-exact.

[enable_improved_land]
value = true
owner = "DemographyConfig"
type  = "bool"
# IMPROVED-LAND (agriculture): cultivable land becomes DEFENSIBLE/claimable where it is actively WORKED —
# inside an active settlement's catchment — NOT merely fertile. "You own what you've cleared and planted"
# (Testart delayed- return; Bandy landscape capital). Opens the AGRARIAN territoriality → stratification
# path (Fertile Crescent/Nile) alongside the aquatic (NW-Coast) one, without letting the ~62% cultivable
# wilderness all be claimable at once. Requires enable_economic_defensibility. Default OFF ⇒ aquatic-only
# claimable (bit-exact).

[enable_aggregation_sedentism]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── AGGREGATION-SEDENTISM (blueprint …_AggregationSedentism; Mauss/Binford/Johnson): settlements as
# MULTI-BAND coalescence — "the gathering that stops dispersing". Q1 lit: villages form by COALESCENCE of
# several bands at a rich node (not one band packing); Q2: the landscape is ~6× below Binford packing, so
# the density must come from AGGREGATING bands. At a persistent-abundant site a seasonal pool (≥
# settle_min_pool people) PERSISTS: members within settle_radius are held (cohesion → site, at the POOL
# scale where it is stable) so the aggregation packs → the density morph fires; scalar stress → hierarchy.
# Dissolves (hysteresis) when the pool can't be sustained. LAYER 1 (this): lifecycle + hold,
# reside-on-cluster harvest. LAYER 2 (later): logistical CATCHMENT foraging (residence ≠ foraging; Binford
# collectors) + catchment-grain defensibility. Needs enable_marriage_aggregation (the gathering) +
# enable_band_affiliation. Default OFF ⇒ no settlements ⇒ bit-exact.

[enable_founding_delay]
value = false
owner = "DemographyConfig"
type  = "bool"
# FOUNDING DELAY (R-106, 2026-09-01). Diagnosed: 78% of the villages alive at equilibrium were founded in
# the FIRST 200 steps — the founders bunch and settle at t=0 and the settlement pattern then FREEZES, so
# the empty good land (55% of the top forage decile) never gets a village. No settlement may be FOUNDED
# before this step, so the founders SPREAD (via IFD / hunger dispersal) for a startup period before "where
# to settle" is decided; existing settlements are unaffected (holding is separate). 0 ⇒ no delay ⇒
# bit-exact. ~180 = one generation (menarche_months), the ethnographic "wander then settle" interval.
# Measured a clean demographic gain (e0 26.4 -> 27.5, l15 -> 0.566, pop up) by letting the founders spread
# before the pattern locks in. Default OFF ⇒ bit-exact; magnitude 180 when on.

[enable_storable_founding]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── FOUNDING ON STORABLE SURPLUS, AND YIELD ON WORKED LAND (R-106, 2026-08-15) ────────────────────── ONE
# DEFECT, TWO SYMPTOMS. `_s_pot_field()` = max(aquatic_food, cultivability) on RAW TERRAIN is asked three
# different questions, and conflates a wild cereal stand with a ploughed field in two of them: is this
# worth settling? -> raw S_pot CONFLATED what does settling yield? -> raw S_pot over the catchment
# CONFLATED can you own it? -> aquatic anywhere; cultivable ONLY where worked CORRECT
# `_update_defensibility_claims` already gets the third right -- "You own what you've cleared (Testart),
# not any fertile wilderness cell" -- so the FOUNDING rule permits founding on land the OWNERSHIP rule
# says cannot be claimed until a settlement is already there. The two layers contradict each other. WHY
# NOT AQUATIC-ONLY FOUNDING, WHICH WAS THE FIRST PROPOSAL. The 2026-08-15 site-suitability survey
# contradicted it with two published cases. (a) MESOAMERICA: Ranere & Piperno PNAS 2009, verbatim --
# "small groups moved around the countryside seasonally ... by farming along river and lake shores"; maize
# and squash domesticated 8,990-8,610 cal BP by MOBILE people, sedentary villages only ~3,000 BP, so the
# lag runs ~5,700 yr the WRONG WAY in one of the three primary domestication centres. (b) THE LEVANT, the
# best case FOR sedentism-first, did not found on a fishery: Natufian base camps sat in oak-pistachio
# woodland on wild cereals, nuts and gazelle (Bar-Yosef, filed), and Bar-Yosef records that "storage
# installations are rare in Natufian sites". SO THE CRITERION IS STORABLE SURPLUS, NOT WATER. Hayden 1995
# (filed) names the mechanism: villages form where someone can control "spatially restricted resource
# locations or productive facilities -- fishing rocks, weirs, boats, deer fences, drying sheds". A dense
# oak or wild-cereal stand qualifies; a salmon choke point qualifies; open water does not. That covers the
# Levant AND Mesoamerica, and it needs no unlock times and no technology tree -- the ordering falls out of
# the terrain. NO NEW NUMBER. The founding test becomes S_pot x `_storable_frac_field()`, the per-cell
# storable fraction ALREADY computed from the local {grain, fish, forage, game} mix with Testart's
# STORABILITY_BY_RESOURCE (grain 0.85 / fish 0.80 / forage 0.15 / game 0.35). Its own docstring already
# states the intent: "Grain/fishing cells -> high (accumulate granaries -> sedentism); fresh-forage cells
# -> low (can't store -> mobile)."

[enable_worked_land_yield]
value = true
owner = "DemographyConfig"
type  = "bool"
# THE SECOND SYMPTOM: RETURNS ARE IMMEDIATE. `_settlement_catchment_yield` grants settle_tier2_yield x
# SUM(S_pot) over the WHOLE catchment the instant a site exists -- no clearing, no soil development, no
# ramp -- and its docstring says it is "RESOURCE-AGNOSTIC", so a fishing village and a farming village get
# the identical instant unlock. Founding is therefore costless and instantly profitable, every qualifying
# site is occupied immediately and permanently, and settlement is a lookup rather than a decision under
# uncertainty. ON => the tier-2 yield is summed only over cells this settlement's band actually OWNS
# (`_cell_owner`), so it RAMPS as claims mature at +1/step to `defensibility_claim_dwell` and spreads
# outward as the village grows. The lag is EMERGENT from the clearing process rather than a parameter
# anybody has to anchor. Settling on a wild stand still pays immediately through tier-1 -- which is why
# the Natufians settled -- while CULTIVATED returns accrue only as land is worked. IT ALSO MATTERS FOR THE
# ELITE LAYER. Hayden's aggrandizer needs a surplus that is controllable and unevenly held. A flat
# catchment-wide tier-2 yield hands every occupant the same thing, so there is nothing to monopolise;
# worked land is spatially uneven AND owned, which is the substrate the mechanism requires. Default OFF =>
# bit-exact.

[enable_catchment_ceiling]
value = true
owner = "DemographyConfig"
type  = "bool"
# CATCHMENT CARRYING-CAPACITY CEILING (R-63): a settled village's TOTAL food (base forage + resource
# tier-2 + agglomeration social-returns) is capped at what its catchment land can sustainably yield — a
# village cannot out-produce its territory, whether by intensifying OR by specializing. This is the
# resource ceiling R-54 recorded (Bettencourt: "a subsistence village has a resource ceiling a modern city
# does not") but never applied — the fix for the UNBOUNDED point-superlinear premium (R-63). Increasing
# returns then RISE → SATURATE at the ceiling → scalar stress caps size; rich (aquatic/arable) catchments
# carry more → surplus → stratify. Default OFF ⇒ bit-exact.

[enable_catchment_depletion]
value = true
owner = "DemographyConfig"
type  = "bool"
# CATCHMENT-FORAGING DEPLETION (R-106, 2026-09-02). Diagnosed: the depletable stock `deplete_and_regrow`
# keys on where agents STAND (`occ_count`), but a settled village FORAGES its whole catchment (tier-2,
# pooled) — so a hunted-out catchment cell that nobody stands on is never depleted, and a village lives on
# an inexhaustible catchment (43 people eating 3.11× requirement with no dispersal pressure). This is the
# central-place depletion the over-clustering lacks (supervisor 2026-09-02: "all the cells where agents
# hunt/forage should be depleted accordingly — an exact map of how much each is foraged"). When on, the
# depletion pressure becomes a FORAGING map: each settled villager's take is spread over its catchment ∝
# each cell's yield (richer cells foraged harder); mobile agents forage where they stand. So a village
# hunts down its catchment, the ceiling (Σ depletable cell yield) falls, per-capita drops, and it must
# spread or split. Regrows when the take eases. Default OFF ⇒ pressure = standing occupancy ⇒ bit-exact.

[enable_village_catchment_spread]
value = false
owner = "DemographyConfig"
type  = "bool"
# VILLAGE CATCHMENT SPREAD (R-106, 2026-09-02). Diagnosed: the over-clustering is NOT the agglomeration
# economy (already ceiling-bound, R-105) — it is the residence pin stacking every village member onto the
# SINGLE site cell. Measured: 100% of the people on big (n≥40) cells are settled/pinned; a "village of
# 150–300" is 150–300 bodies on one 100 km² cell, eating LESS per head than a loner. A real village's
# dwellings spread over its territory. When on, each settled member is pinned to a deterministic HOME cell
# within settle_radius (∝ cell yield, so richer cells hold more dwellings) instead of the site point, so
# the PHYSICAL footprint and the density-disease hazard (which reads occ_count[pos], Binford 0.091
# reference) follow the spread. FOOD stays bit-exact: the harvest regroups a village's members at its site
# (the village forages its catchment as one economic unit — tier-2 pool + ceiling unchanged), so a spread
# villager's share equals a stacked one's. The split is principled: physical crowding disperses,
# social/economic coordination does not. Default OFF ⇒ the pin targets the site cell ⇒ bit-exact.

[enable_settlement_scalar_stress]
value = true
owner = "DemographyConfig"
type  = "bool"
# SETTLEMENT SCALAR STRESS (Johnson 1982, dissipated by hierarchy) — the missing cost that caps VILLAGE
# size. The residence pin otherwise pulls every nearby agent into a settlement unconditionally ⇒ villages
# grow to the food ceiling with no cap (R-63). Here an over-crowded settlement REPELS agents (prob =
# size_repulsion(village_pop)) — but the repulsion is scaled by the settlement's SOCIETY factor
# (egalitarian 1.0 → complex 0.5 → stratified 0.25): hierarchy absorbs scalar stress (Johnson's thesis),
# so an EGALITARIAN village fissions at ~midpoint while a STRATIFIED one grows past it. Combined with the
# catchment ceiling this closes the loop: cap at ~150 → surplus (ceiling > pop) → morph to stratified →
# scalar stress weakens → village grows toward the ceiling. Default OFF.

[enable_tier2_shock]
value = true
owner = "DemographyConfig"
type  = "bool"
# LAYER 2b core — SHOCK (a bad-run / drought year). Fisheries don't deplete-collapse (salmon self-renews —
# NW Coast stable millennia); the real dispersal driver is a correlated bad YEAR that STORAGE must buffer.
# Once per aggregation_period a mean-preserving REGIONAL lognormal `s ~ LN(CV=shock_cv)` scales that
# year's tier-2 yield (shared across settlements — a climate bad year can't be insured away). Full
# granaries ride it out; thin ones → deficit → the existing starvation + settlement-dissolve → dispersal
# EMERGES. Anchor: salmon run inter-annual CV ~0.5–1 (ENSO/ocean regimes). Soil-depletion + learning
# (landesque capital) deferred to the cultivability tier. Default OFF ⇒ shock=1.0 ⇒ bit-exact.

[enable_agriculture]
value = true
owner = "DemographyConfig"
type  = "bool"
# AGRICULTURE TIER Layer A (blueprint …_AgricultureTier): add `cultivability` (EFC-derived,
# resource-agnostic) as a SECOND S_pot source → S_pot = max(aquatic_food, cultivability), so settlements
# form on FERTILE LAND and behave like fishery villages (the generality payoff — farming villages via one
# field). Layer B (soil-depletion + landesque + relocation → the dynastic bust) follows. Default OFF ⇒
# S_pot = aquatic_food only ⇒ bit-exact.

[enable_soil_depletion]
value = true
owner = "DemographyConfig"
type  = "bool"
# AGRICULTURE TIER Layer B1 — SOIL DEPLETION (the bust driver fisheries lack). A FARM settlement
# (cultivability > aquatic at its site) degrades a per-site SOIL stock ∈[SOIL_FLOOR,1] under farming
# pressure; tier-2 farm yield × soil. Regrowth is SLOW (swidden fallow ~10–20 yr) — depleted land only
# recovers on a long fallow (after the village leaves). FISHERIES are exempt (aquatic-dominant sites never
# deplete → R-53 stable villages preserved). This gives boom → soil-degrade → yield-fall → bust
# (relocation = Layer B3). Default OFF ⇒ soil≡1 ⇒ bit-exact.

[enable_alluvial_renewal]
value = true
owner = "DemographyConfig"
type  = "bool"
# ALLUVIAL RENEWAL — soil renewal is TERRAIN-dependent, not uniform. The annual FLOOD re-deposits nutrient
# silt, so FLOODPLAIN farmland is renewed WHILE FARMED (the Nile floodplain was cropped ~5,000 yr
# essentially without fallow — the flood WAS the fertilizer), whereas RAIN-FED dryland exhausts → the
# swidden deplete→fallow→re-settle cycle. Keyed on `wateracc`, the SAME alluvial signal
# cultivability_field already uses (CULT_WATER_BASE far-from-water = rain-fed/no alluvium …
# CULT_WATER_GAIN at the water = alluvial floodplain/irrigable = prime; Nile/Mesopotamia/Indus). ⇒ TWO
# agrarian regimes emerge: rain-fed SWIDDEN (deplete→abandon→re-settle = cycles) vs HYDRAULIC floodplain
# (renewed → stable, dense, stratifying without cycling). Requires enable_soil_depletion. Default OFF ⇒
# every farm depletes (bit-exact).

[enable_emergent_abandonment]
value = true
owner = "DemographyConfig"
type  = "bool"
# EMERGENT ABANDONMENT — a settlement's HOLD on its people is not permanent; it erodes when the village's
# REMEMBERED FORTUNES have been bad for a long time. There is NO "if soil < X then dissolve" rule and NO
# global knowledge: the agents' ordinary IFD drive already wants to move somewhere better — it is merely
# OVERRIDDEN by the residence pin. So we make the PIN condition-dependent on the site's own history (which
# is the only information the elders actually have) and let the existing drive decide: released ⇒ the
# agent stays anyway if nowhere nearby is better, or drifts out if it is → the pool falls below
# settle_min_pool → the settlement dissolves by the EXISTING rule → the field fallows → budding re-settles
# fresh land. Abandonment thus EMERGES. memory: per-SITE EMA of hardship (1 − realized field productivity)
# — attached to the PLACE (members churn, the place persists). A slow EMA ⇒ one bad year does not move it
# (natural hysteresis); only CHRONIC decline does. Fisheries/alluvial sites keep soil ≈1 ⇒ hardship ≈0 ⇒
# they never abandon (the permanent hydraulic village). ANCHOR: swidden villages relocate every ~5–30 yr
# (Conklin's "integral pioneers… move on to new village sites often"; Yanomamö ~5–10 yr) = WITHIN one
# generation, not several. Requires enable_soil_depletion. Default OFF ⇒ the pin never releases
# (bit-exact).

[enable_hunger_dispersal]
value = false
owner = "DemographyConfig"
type  = "bool"
# ACUTE FAMINE DISPERSAL (R-106, 2026-09-01; Colson 1979 M2 anchor, LITERATURE.md — "the breakup into
# small family groups which comb the region"). The residence pin holds a settled agent on its crowded site
# cell, where it eats the CRASHING pooled share; the emergent-abandonment valve above releases it only on
# CHRONIC remembered hardship, far too slow for the one-step crash that kills (96% of starvation deaths
# are acute). Diagnosed (R-106 dispersal): 98% of the hungriest decile are pinned settlers, and 99% would
# eat >1.3x better by stepping to an ADJACENT cell one stride away — it is a RETENTION failure, not a
# reach failure, so the fix RELEASES the pin (no stride change). When a settled agent's reserve fill
# fraction falls below `hunger_flee_reserve_frac`, it breaks the pin THIS step and its ordinary IFD drive
# takes the better per-capita cell. The crowd thins, per-capita rises, and the acute crash is averted;
# villages re-form when the lean passes (the abandonment/budding cycle). Default OFF ⇒ pin never released
# on hunger ⇒ bit-exact.

[enable_agglomeration]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── AGGLOMERATION ECONOMICS (the "grand unification" rework; blueprint …_AgglomerationEconomics). ONE
# idea: INCREASING RETURNS TO CO-LOCATION. Each cell's intensive catchment resource R(c) =
# aggl_tier2·Σ_catchment(S_pot· soil); a co-located group of n gets total output R·L(n) with
# L(n)=n^α/(n^α+half^α) (convex→saturating), so per-capita R·L(n)/n is SINGLE-PEAKED in n. Under IFD,
# agents then aggregate to the peak → villages/packing/optimal- size/relocation/bust all EMERGE, replacing
# the discrete settlement lifecycle. Applied CONSISTENTLY to movement (perceived) AND harvest (realized)
# so no over-subscription death. α anchored to Bettencourt ~1.15 (MODEL_SPEC §4.8.21) — SWEPT (band-scale
# at 1.15, village-scale needs sharper). Default OFF ⇒ legacy S/(n+1) ⇒ bit-exact. aggl_mode selects the
# returns-to-co-location FORM: "point" — Bettencourt-CORRECT (Branch A): the cell's OWN intensive output
# scales super-linearly with its occupancy, O(n) = A_cell·n^β, so PER-CAPITA = A_cell·n^(β-1) RISES with n
# (β>1) → co-location is genuinely more productive per head → packing NUCLEATES and reinforces GRP. A_cell
# = tier2·S_pot·cv_ref (single cell — a POINT return, not an areal sum). This is the intended
# agglomeration economy. "catchment" — FALSIFIED (kept for comparison): shared catchment pot R·L(n)/n with
# L saturating → per-capita PEAKS then CONGESTS (∝1/n at scale) → areal-dispersive, monotonically REDUCES
# packing as tier2 rises. The exponent there (aggl_alpha) is a logistic saturation-sharpness, NOT
# Bettencourt's scaling β. See DEAD_ENDS + MODEL_SPEC §4.8.21.

[enable_forage_cap]
value = true
owner = "DemographyConfig"
type  = "bool"
# PER-PERSON FORAGE CAP (the solitude fix): a forager can only WORK so much land — intake is capped at the
# biome return-rate × work hours (forage_kcal[cell] · forage_cap_hours), NOT the whole cell (S/n gave a
# lone agent ~27× subsistence → solitude over-rewarded → aggregation never paid; GATE-3). Grounds the
# economy in the Survey-A return-rate data (MODEL_SPEC §4.1; forage_kcal already a field, biome-dependent
# + right-skewed distribution). Flattens the forage per-capita (≈cap up to carrying) so
# grouping/agglomeration decide clustering. Applied in movement (perceived) AND harvest (realized).
# Default OFF ⇒ legacy S/n ⇒ bit-exact. (v2: × age-skill curve + cred-transmitted embodied capital —
# Walker 2002 / Gurven 2006 / Koster 2020, pending fetch.)

[enable_need_weighted_shares]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── THE CLAIM WEIGHT ON THE CELL SPLIT (R-106, 2026-08-15) ────────────────────────────────────────────
# THE DEFECT. `compute_harvest_shares` gives every occupant S/n at κ=0. 59% of a canonical population is
# under 15 (measured age_0_5 26.0%, age_5_15 33.2%), so a newborn claims exactly what a 30-year-old hunter
# claims. The consequence is measurable and it is the reason the demography will not move: the realised
# hazard is FLAT at ~0.06/yr from age 1 to 60 (m_1_5 0.069, m_5_15 0.057, m_15_30 0.060, m_30_45 0.059,
# m_45_60 0.064) while Siler ACHE_FOREST gives 0.0141/yr at age 30. An excess of ~0.045/yr that does not
# vary with age cannot come from starvation, which kills the small and the old first. It comes from an
# age-blind split. This also resolves the paradox that the median agent eats 2.8× requirement while
# starv_share is 0.51: only ~3% sit below the floor at any instant, and the flux through that state
# carries the deaths at every age at once. TWO SEPARATE ASSERTIONS, TWO FLAGS. Measure each alone. Turning
# both on first is how one fails to learn which worked. Both default OFF only so the pre-fix split stays
# runnable as the negative control; the adoption decision is made on measurement in the same session,
# never deferred.

[enable_eta_weighted_shares]
value = true
owner = "DemographyConfig"
type  = "bool"
# Claim ∝ `consumption_factor(a)` — a person claims in proportion to what they need. [ANCHORED — Kaplan
# 2000, already the citation on `BaseAgent.consumption_factor`: human childhood is a long net CONSUMER
# period subsidised by adult production. The model already holds the number and throws it away at the one
# place that decides who eats.] Introduces NO new parameter: the ramp is the existing cons_min 0.3 → 1.0
# over forage_age_min. Population-mean consumption_factor over the measured age structure is ~0.771, so an
# adult share rises ~1.30×.

[enable_bonded_mating]
value = true
owner = "DemographyConfig"
type  = "bool"
# Claim ∝ `eta(a)` — a person claims what they can actually harvest. The module contract in substrate.py
# states shares are PRE-efficiency and the caller applies η when banking, so today a juvenile removes a
# full adult share from the pool and converts only η of it (phase1_model `intake = a.eta() * sh`).
# Population-mean η over the measured age structure is ~0.737, so ~26% of every cell pool is claimed by
# someone who cannot take it. Introduces NO new parameter: the ramp is the existing eta_min 0.2 → 1.0.
# [DERIVED from the existing η contract, not a new anchor.] WHEN BOTH ARE ON the weights MULTIPLY (claim
# what you can take, scaled to what you need). That is a THIRD condition with its own size, so it is
# reported as its own arm and never as evidence for either. The κ contest composes on top of the claim in
# every case, so Carbon keeps its ordering within an age class and κ=0 stays the pure claim split. THE
# FORAGE CAP DOES NOT NULLIFY THIS, and the reason decides whether the mechanism can work at all:
# `enable_forage_cap` clips the FORAGE stream only, while the meat stream (game_meat_frac 0.55) is split
# flat and uncapped. And in the crowded cells where agents actually die, S/n is far below the cap. The cap
# binds in rich empty cells; the claim weight bites in the starving ones. (storage_tether_reserves RETIRED
# 2026-06-29 — the band-aid that froze stocked bands in place to force packing; superseded by the
# emergent-bands grouping drives + bonded mating, which reach packing and fire the morph on their own. See
# MODEL_SPEC §4.8.5 and outputs/.../run_3h_tether_retirement.py.) F.1 bonded mating (emergent bands via
# SELECTION): a female reproduces only if her cell has a co-resident adult male who is NOT her own son
# (kin-avoidance) — a LONER cannot reproduce, so loner lineages die out and the population concentrates in
# bands by selection (not navigation). Default OFF = asexual/female-only (R-18/19).

[enable_pair_bonds]
value = true
owner = "DemographyConfig"
type  = "bool"
# `enable_band_risk` / `band_risk_penalty` / `band_risk_size` WERE HERE AND ARE DELETED (2026-08-06). F.2
# band risk-dilution: a sub-band group loses the safety-in-numbers mitigation on the exogenous biome
# hazard → elevated a2 mortality, scaled by the cell's own incident rate (Hamilton 1971 selfish-herd).
# With density-disease rising in crowding, this was hypothesised to produce an emergent OPTIMAL band size.
# ⚠ THE FINDING, WHICH IS THE POINT AND IS KEPT: **it does not, and it cannot.** Mortality does not cause
# aggregation — that is the E.1 movement safety-drive's job. A loner-mortality penalty just CULLS: fewer
# people → lower density → smaller bands → more loners → more penalty. A DEATH SPIRAL, not a stabilising
# optimum (F.2 prototype run_3i, 2026-06-29; penalty 0→6 took pop 281→64 and mean band 56→5). WHY DELETED
# RATHER THAN LEFT OFF: the gain defaulted to 0.0 and the code was guarded by `> 0.0`, so the flag could
# read ON in a config dump while the mechanism was INERT — it survived a whole ablation battery as a fake
# positive. The only two states available were "does nothing" and "kills the population", and a knob with
# no useful setting is not a knob. Risk-dilution belongs in MOVEMENT (E.1); banding already has fitness
# teeth via the F.1 mate-gate. RECOVERY: the mechanism, and the `run_3i_band_risk_proto.py` sweep that
# killed it, are both at commit daa7194 ("F.2: risk-dilution mortality SHELVED (negative result) + band
# life-cycle diagnostics"). The prototype was deleted with the fields — it could not have run again, and a
# script that cannot run is the same kind of lie as a flag that does nothing. F.3a/b PERSISTENT FAMILIES
# (the deferred "C"; core of FD-1). `enable_pair_bonds`: a female forms a DURABLE monogamous bond with a
# band male (prowess-weighted by mate_choice_strength), persisting across births (vs the per-conception
# lottery); births default to the living co-resident partner; the bond dissolves on partner death (→ widow
# re-pairs = serial monogamy) or at `divorce_rate`/step. The NUCLEAR FAMILY — mother + bonded father +
# dependent children (age < `family_maturity_months`) — MOVES AS A UNIT (co-locates to the mother each
# step); children DETACH at maturity → exogamous dispersal. Builds stable family-cored bands (Hill et al.
# 2011; Marlowe monogamy). Uses bonded_mate_radius as the band extent. Default OFF = bit-exact
# back-compat.

[enable_band_affiliation]
value = true
owner = "DemographyConfig"
type  = "bool"
# ⚠ UNIT WARNING on the "~25, Hill 2011" below (Addendum 28; propagated here 2026-08-06, Addendum 29).
# Hill et al. 2011's verified number is **28.2 ADULTS** per band (32 societies). The all-ages ~25 (and the
# [18–35] band this project scored for years) is a MIS-ATTRIBUTION of it. That matters because the model
# carries too many children: on the adults unit `band_med` reads 11.8 against 28.2 and FAILS 16/16, while
# the all-ages reading "passes" 23/25 on the strength of the surplus children. Birdsell's ~25 stands on
# its own; Hill's does not support an all-ages 25. Treat the split/merge sizes below as tuned to Birdsell,
# not to Hill, until `band_med` is re-scored on adults. F.3c-1 BAND AFFILIATION (the collective-identity
# vector's band_id cell). A persistent band membership that families AFFILIATE into → multi-family bands
# (~25, Hill 2011 / Birdsell), the stable handle per-band society attaches to. Newborns inherit the
# mother's band; at marriage the incoming spouse JOINS the larger/richer band (FLEXIBLE/multilocal — keeps
# bands non-kin). A band-cohesion movement drive pulls family-roots toward their band's centroid (food
# stays dominant); emergent fission (> band_split_size) / fusion (< band_merge_size) with hysteresis bound
# band size ~25. Requires enable_pair_bonds. Default OFF = bit-exact back-compat.

[enable_emergent_band_size]
value = true
owner = "DemographyConfig"
type  = "bool"
# EMERGENT BAND SIZE v3 (blueprint …_EmergentBandSize; R-72). Band size = the argmax of {risk-pooling −
# competition}, per the blueprint's original spec. Two coupled changes vs v1/v2: (1) LINEAR law, no
# clamps: g* = CV/cv_safe, where CV is the local DAY-TO-DAY return CV (terrain.RETURN_CV — a temporal
# field, NOT the spatial FORAGE/GAME_KCAL_STD; see terrain.py). v1/v2 used g*=(CV/cv_safe)², which is a
# *stopping rule with no cost side* ("pool until residual CV hits a threshold") — unbounded in CV, hence
# the clamps, hence saturation at 15/45 with nothing in between. The linear form falls out of
# benefit-vs-cost: pooled variance falls as σ²/n while crowding cost rises with n, so the optimum is n* ∝
# CV. It needs no clamps, and a 2× CV spread gives a 2× band spread — which is what the ethnography shows
# (Marlowe/Kelly 25–50). (2) The CV drives the COST side. v1/v2 only lowered the fission *ceiling*, i.e. a
# permission to be big — measured corr(g*, band size) = −0.22, no gradient, because a ceiling cannot pull
# a band together. `repulsion_midpoint` (Johnson scalar stress) is the term that actually sets band size,
# and it was still hardcoded at 25 — which is why R-64's "band ≈ 24" came out at 24. It is now per-band =
# g*(CV), so a high-variance band tolerates crowding longer before scalar stress bites. This deletes
# band_size_min, cv_min, and the two hardcoded 25s from the ON path (band_base_tolerable and
# repulsion_midpoint survive only as the default-OFF values ⇒ bit-exact back-compat).

[enable_dynamic_bands]
value = true
owner = "DemographyConfig"
type  = "bool"
# F.3c-3 DYNAMIC fission/fusion + the ASSABIYAH seam (Ibn Khaldun group solidarity). Instead of a hard
# split at band_split_size, a band fissions only above its CONDITION-DEPENDENT `tolerable_size` = base +
# (hard_cap − base)·assabiyah — so a rich, high-solidarity band STAYS TOGETHER larger; a poor one fissions
# at the base. `assabiyah` (the GroupVector seam, now active) builds from the band's SURPLUS (success →
# solidarity, +gain· surplus) and decays (−decay) — a per-band cohesion state, mirrored onto members'
# GroupVector. band_split_size stays the absolute runaway cap; band_merge_size the viability floor.
# Requires enable_band_affiliation.

[enable_leaky_assabiyah]
value = false
owner = "DemographyConfig"
type  = "bool"
# ── THE COHESION BUDGET HAS NO HEADROOM (R-106 Addendum 22) — two flagged candidates ──────────────
# MEASURED: `cohesion_frac = clamp01(assabiyah + leader − repulsion − malnutrition)` is pinned at 1.0 for
# every band that has a leader, so `split_thr` collapses to the constant `band_split_size` and g* (hence
# `cv_safe`) drops out. corr(g*, band size) = −0.077; a cv_safe sweep over +22/+41/+62% moved `band_med`
# by −1.9/−3.5/−8.4%, an elasticity of −0.14 against the law's −1.0. Four mechanisms feed that one
# saturated expression — emergent band size, dynamic bands, size repulsion, malnutrition fission — and are
# structurally inert at ANY magnitude. (1) LEAKY ASSABIYAH. The update above is `a += gain·s − decay`: a
# pure integrator with a CONSTANT leak, so it has no interior fixed point at all. If `gain·s > decay` it
# climbs to the clamp and stays; otherwise it falls to 0. It is bang-bang BY CONSTRUCTION, and no choice
# of gain/decay makes it graded — only the share of bands at each end changes. Measured: 95.7% of bands
# sit above the switchover `s = decay/gain = 0.40` (band surplus runs 0.35–0.99, median 0.69), and
# assabiyah's median is exactly 1.000 from step 100 onward. Making the leak proportional to the level — `a
# += gain·s·(1−a) − decay·a` — gives the interior fixed point `a* = gain·s / (gain·s + decay)`, which
# TRACKS surplus: 0.47 at s=0.35, 0.63 at the median 0.69, 0.71 at s=0.99. That is what F.3c-3's premise
# needs ("a rich, high-solidarity band STAYS TOGETHER larger; a poor one fissions at the base") — the band
# has to be able to be poor.

[enable_leader_coherence]
value = true
owner = "DemographyConfig"
type  = "bool"
# (RETIRED 2026-07-01, DE-7: `season_aggregation` coupled tolerable_size to seasonal abundance →
# lean-season fission. Mis-signed (moderate lean should not fission) + inert (dormant threshold, R-31).
# Superseded by M2 malnutrition fission. Field removed; configs that set it will now error — intended, it
# is retired.) Social-Evolution Stage 1: LEADER COHERENCE (a SECOND, distinct cohesion source added to
# `tolerable_size`, additive alongside assabiyah, not a relabel). A band's top-status member (highest
# cred·prowess) lends extra cohesion, scaled by a Boehm 1999 reverse-dominance GATE on the band's society
# type (egalitarian bands LEVEL would-be leaders → weight≈0; complex/stratified bands institutionalize
# authority → weight rises). Read FRESH every step from current membership (no accumulated state, unlike
# assabiyah) so the benchmark signature — leader death/removal → an IMMEDIATE cohesion drop → a fission
# spike next check — is not smoothed by a decay lag. Requires enable_dynamic_bands (the term feeds the
# same tolerable_size headroom). Default OFF = bit-exact (leader_term≡0 regardless of gain when the flag
# is off).

[enable_size_repulsion]
value = true
owner = "DemographyConfig"
type  = "bool"
# Social-Evolution Stage 1b: SIZE-DRIVEN REPULSION (Johnson 1982 scalar stress) — a DISPERSIVE
# counterweight to cohesion, rising with band size N via a logistic (Alberti 2014 shape), SUBTRACTED from
# the cohesion_frac so a large band needs MORE cohesion (assabiyah+leader) to stay whole. DISTINCT from
# the existing resource- scarcity fission (that runs through assabiyah↓ when surplus is low; this is
# resource-INDEPENDENT, purely coordination cost). Boehm/Johnson coupling: scalar stress is what
# organizational HIERARCHY exists to absorb, so the repulsion is scaled by REPULSION_SOCIETY_FACTOR — FULL
# in egalitarian mobile bands (no hierarchy → capped ~small), RELIEVED in complex/stratified (settling +
# institutions let a group grow toward the hard cap). The midpoint is the band-scale scalar-stress onset
# (≈ the Wobst-minimal band); the width is Alberti's logistic shape re-anchored to band scale
# (village-scale N≈127 → band scale — a bracket, not a fit, cf. the regime °C→CC% re-anchoring). Requires
# enable_dynamic_bands. Default OFF ⇒ repulsion≡0, bit-exact. Johnson 1982 scalar stress as a dispersive
# term. **The anchor is Alberti 2014** (PLoS ONE 9(3):e91510), who fits P(critical scalar stress |
# community size n) by logistic regression on archaeological + ethnographic cases: `logit = b0 + b1·n`
# with **b0 = −18.636** (SE 3.127) and **b1 = 0.147** (SE 0.025), both p<0.001; 98% correctly classified,
# Somers' D 0.99. Equivalently midpoint = −b0/b1 = **126.9** (95% CI 121.9–131.9) and width = 1/b1 =
# **6.80**. Cross-check: p=0.99 at n=158.2 ⇒ logit 4.62 ✓. ⇒ ANCHORED VALUES: `repulsion_gain = 1.0`
# (Alberti's logistic IS a probability ∈ [0,1] — any gain<1 arbitrarily attenuates it) and
# `repulsion_width = 6.80`. **CAVEAT (R-72):** Alberti's 126.9 is a COMMUNITY — i.e. the VILLAGE rung
# (Bar-Yosef 50–150, which `enable_settlement_scalar_stress` uses; R-63/R-64) — NOT the ~25 band. Applying
# his slope at band scale extrapolates below his data. **The validated village stack
# (`emergent_village_demog`, R-54…R-64) runs gain=0.3 + width=6.0** — i.e. a 0.3 attenuation and a rounded
# width. Left as-is: those results are validated at those values, and testing gain=1.0 did NOT rescue the
# band gradient (+0.335 → +0.374 paired, still n.s.), so re-running the village stack would buy
# documentation tidiness at the cost of re-validating R-54…R-64.

[enable_malnutrition_fission]
value = false
owner = "DemographyConfig"
type  = "bool"
# Resource-response redesign (blueprint …_ResourceResponse_Scoping): M2 — MALNUTRITION FISSION: a band
# losing members to REALIZED starvation adds a DISPERSIVE term that lowers tolerable_size toward
# band_base_tolerable → a large band breaks up (fission), the child band diffuses apart → lower local
# density → higher per-capita yield → the subsequent starvation mortality relaxes (dispersal SUBSTITUTES
# for further death). REACTIVE, not a forecast (supervisor: real bands disperse when starvation actually
# bites, not on anticipation — anticipatory dispersal would be a future "wise leadership" feature). Signal
# = an EMA of the band's per-capita starvation-death rate (`_band_starv_ema`); NOT `_condition` (which
# samples the post-harvest FED reserve → pinned ~1.0 under scarcity, survivor-biased — see RESULTS R-32).
# Intrinsically size-gated: tolerable floors at band_base_tolerable, so only bands LARGER than it can
# fission (small bands just shrink/die). Default OFF.

[enable_resource_directed_fusion]
value = true
owner = "DemographyConfig"
type  = "bool"
# F — RESOURCE-DIRECTED FUSION: a band below band_merge_size joins the RICHEST nearby neighbour (highest
# `_band_surplus`) instead of the NEAREST — starving remnants merge into well-provisioned bands (Wiessner
# hxaro). Bounded to `fusion_search_radius` cells (stay local; fall back to nearest if none in range).
# Default OFF ⇒ nearest-neighbour join, bit-exact.

[enable_village_scaling]
value = true
owner = "DemographyConfig"
type  = "bool"
# Stage 1 (village-nucleation arc) — SUPRA-BAND SCALING: band_split_size is normally a HARD cap
# (cohesion_frac clamped to [0,1] ⇒ tolerable ≤ band_split_size). Johnson 1982: a group exceeds
# scalar-stress-limited band scale ONLY when payoff + HIERARCHY overcome scalar stress. When enabled, net
# payoff ABOVE saturation (the UNCLAMPED assabiyah + leader − repulsion − malnutrition, minus 1) adds
# village HEADROOM beyond the hard cap: tolerable = base + (cap−base)·min(1,net) +
# village_gain·(cap−base)·max(0, net−1). Since assabiyah alone caps at 1 (= the hard cap exactly),
# exceeding band scale REQUIRES the leader/hierarchy term (enable_leader_coherence) — villages need
# leadership (Johnson/Testart). Default OFF ⇒ hard cap, bit-exact.

[enable_village_budding]
value = true
owner = "DemographyConfig"
type  = "bool"
# VILLAGE BUDDING (Bandy 2004; Chagnon 1975) — the ethnographic settlement-SPREAD/recovery mode. A village
# (band_id) grown past a scalar-stress FISSION THRESHOLD sheds its RIVAL-LEADER (2nd-largest lineage)
# faction, which RELOCATES to a nearby available STORABLE site and founds a DAUGHTER village. So the
# settlement system propagates by BUDDING (not by aggregating scattered individuals — the mode
# aggregation-only lacked, R-68) and re-spreads after a crash. Fission CEASES once a village STRATIFIES
# (integrative institutions suppress it — Bandy → the Carneiro fork). If no open site is in reach
# (CIRCUMSCRIPTION → high relocation cost), budding fails and the village stays large (existing morph →
# hierarchy handles it). Requires enable_band_affiliation. Default OFF ⇒ no-op (bit-exact).

[enable_colonizing_budding]
value = true
owner = "DemographyConfig"
type  = "bool"
# COLONIZING BUDDING (R-106, 2026-09-03; docs/DESIGN_colonization_spacing.md). Diagnosed: the population
# sits at 2% of the terrain's carrying capacity — trapped, not starved — because a shed faction cannot
# ESTABLISH on empty rich land. `enable_bud_requires_occupancy` (adopted, Addendum 53) fixed village
# spacing but by forbidding establishment: the faction relocates and must re-aggregate 40 people, which
# never happens on empty land, so the parent grows to 300–500 and the excess dies of crowding-disease in
# place. Probe (4 seeds): freeing establishment lifts density 4× toward the anchor but packs villages to
# 1-cell spacing. WHEN ON, budding (a) sheds a VIABLE emigrant bloc (topped up to settle_min_pool, led by
# the rival, seeded by his kin — not the median-2 kinship sliver that made 2-person "villages"), (b)
# FOUNDS the daughter directly on the nearest open storable cell, (c) spaced by a DENSITY-SCALED
# separation d = clamp(round(sqrt(V_target / K_local)), 1, 3) cells — ~1.6 on rich/aquatic land, ~3 on
# poor land (the ethnographic gradient), replacing both the rejected fixed 50 km rule and the 1-cell
# overlap. It SUPERSEDES enable_bud_requires_occupancy (folds it in as the OFF path). Default OFF ⇒ the
# occupancy/legacy path ⇒ bit-exact.

[enable_bud_hazard]
value = false
owner = "DemographyConfig"
type  = "bool"
# ── EMERGENT FISSION HAZARD (2026-07-27) ──────────────────────────────────────────────────────── Fission
# is no longer a size THRESHOLD but a per-village-per-step HAZARD. Bandy 2004 is explicit that the
# threshold is not a constant — "if the cost of fissioning is low ... fissioning may be expected to occur
# frequently and at a VERY LOW population threshold" — and that the outcome is a RACE: Johnson's growth →
# conflict resolves "in only one of two ways: (1) the village fissions or (2) institutions ... emerge ...
# in such a way that fissioning is not necessary", the latter opening the way to "greater social group
# sizes, and spiraling social inequality". A village whose economy works therefore does NOT split, and
# large stable centres become an OUTCOME rather than something suppressed by hand. OFF ⇒ the old
# size-threshold path, bit-exact

[enable_wealth_obligation]
value = true
