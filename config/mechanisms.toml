# CRED RENORMALISATION (R-81) — per-step rescale of cred to population-mean 1. FIXES a latent homeostat
# defect: the inheritance reverts toward a FIXED 1.0 anchor (a contraction validated in R-18,
# pre-selection), but R-19/R-20 added fertility-weighted mate-choice + a `cred·prowess` product base —
# both inject an upward bias each generation that DEFEATS the fixed-1.0 contraction (measured: mean cred
# 1→18.6 over 2000 steps, so the homeostat's `ρ·1.0` pull becomes negligible vs `(1−ρ)·base` ⇒ the
# homeostat progressively loses grip). Renormalising to mean-1 each step restores the anchor's meaning
# (1.0 = the running mean again) ⇒ constant homeostat grip ρ at any scale, without the
# "revert-to-co-moving-mean" unbounded-drift the red-team blocked (RT: that had no fixed scale; this pins
# the scale hard). Cred enters every downstream weight RELATIVELY (`(cred)^κ` / Σ, normalised mate
# weights), so the rescale is dynamics-neutral for those — but it re-tightens the inheritance homeostat,
# which LOWERS the realised Gini (so it re-touches R-19's status→RS; re-verify). Prerequisite for the
# elite/material layer (a leaking homeostat can't be made state-dependent, Stage D). Default OFF ⇒
# bit-exact.

[enable_material_capture]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── ELITE LAYER, STAGE A (R-82): MATERIAL as a third capital cell ─────────────────────────────── The
# status vector is [cred (ascribed), prowess (achieved), MATERIAL (durable)]. cred/prowess couple to the
# food contest and mating, but BOTH wash out materially — measured corr(cred, wealth) ≈ 0, because the
# sharing economy feeds everyone to their reserve cap each step. **Durability is the stratifying
# property**: a small per-step capture advantage integrates into a large stock gap only if the stock
# PERSISTS. ANCHORS (all [VERIFIED] in LITERATURE.md): **Sahlins 1968** — foragers deliberately "run below
# capacity" (~20–30%), so surplus is a SOCIAL outcome, not a technical given; **Boehm 1993** — that
# baseline is held by active leveling (38/48 societies remove an over-assertive individual; triggers
# include "lack of generosity or MONOPOLIZING RESOURCES"); **Testart 1982** — STORABLE surplus is the
# escape route, because a granary cannot be shared out the way a carcass can; **Hayden** (aggrandizer /
# control-of-redistribution, TO-GRAB) — the driver: the aggrandizer claims MORE THAN HE NEEDS and converts
# it to durable goods. MECHANISM — capture the granary LEFTOVER. The S.2 draw is deficit-capped, so
# weight-rich but near-full claimants leave surplus in the store ("any leftover … stays in the granary").
# That leftover is exactly what an aggrandizer takes beyond need: it is claimed status^κ-weighted into a
# DURABLE `material` stock (not `wealth`, which is burned and capped). High cred ⇒ bigger claim ⇒ material
# stratification that does NOT wash out. Requires enable_storage (the granary) + the
# overwintering/seasonal zone.

[enable_material_inheritance]
value = true
owner = "DemographyConfig"
type  = "bool"
