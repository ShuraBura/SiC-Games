[enable_village_density_disease]
value = true
owner = "DemographyConfig"
type  = "bool"
# VILLAGE-SCALED DENSITY DISEASE (R-106, 2026-09-03; docs/DESIGN_colonization_spacing.md, the keystone).
# THE DEFECT the whole density arc kept hitting: the density-disease hazard reads occ_count[cell] —
# SINGLE-CELL occupancy — so it is the ONLY Malthusian brake, and it is defeated by any dispersal
# (catchment-spread A.58, colonizing budding A.59): spread the people and per-cell occupancy falls, the
# brake releases, and the population runs away to the food ceiling (~7× the anchor). Epidemiologically the
# single-cell form is also wrong: airborne crowd disease scales with the SETTLED COMMUNITY's size and
# density, not the exact dwelling spacing — a village of 470 carries a village-scale load whether its
# houses sit on one cell or spread over nine. WHEN ON, a SETTLED agent's disease density is its VILLAGE
# population over the village territory ((2·settle_radius+1)² cells), so the brake keys on village size
# and is SPREAD-INVARIANT; a MOBILE agent keeps the single-cell form. With dens_rho_ref = 0.091 (Binford
# packing) over the 25-cell / 2500 km² territory, a village faces rising disease above ~227 people — the
# Bar-Yosef/Bandy realistic ceiling. This is the brake that lets colonizing budding / catchment-spread
# disperse the population WITHOUT a runaway. Default OFF ⇒ single-cell form ⇒ bit-exact.

