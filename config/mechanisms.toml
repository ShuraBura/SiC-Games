# tribute", NOT overreach-grievance). Without it, the model's Boehm overreach mechanism DEPOSES any
# material accumulator, so an elite can never lock in. ON ⇒ an ASCRIBED (noble) leader's
# material-overreach grievance is scaled by (1 - noble_exemption_frac); his FAILURE-TO-DELIVER grievance
# is untouched (a noble is still deposed for famine, just not for wealth). Default OFF ⇒ bit-exact.

[enable_lineage_tribute]
value = true
owner = "DemographyConfig"
type  = "bool"
# R-103f — PER-LINEAGE (CHIEFLY) TRIBUTE. The office levy (`leader_share`) fills a rotating OFFICE and
# cannot make a hereditary estate (R-103e benchmark: leader_material_lift rose to 1.26 but
# noble_material_lift stayed 1.10 — the levy concentrates in the office, not the lineage). This is the
# LINEAGE channel: in each band the locally-dominant ASCRIBED lineage's head (the CHIEF, by
# legitimacy+rank, NOT by winning the office contest) levies `lineage_tribute_frac` of every
# non-chief-lineage member's durable production. The estate therefore persists across office turnover and
# is bequeathed WITHIN the lineage — Friedman "the legitimated lineage controls resources and is entitled
# to tribute"; Earle wealth finance. Rate anchor: gumsa "a thigh from every animal" ≈ 0.10–0.15 of a kill
# (DM-F6; no % levy rate exists in the lit — D'Altroy&Earle verified neg — so this is calibrated to
# OUTCOME: noble_material_lift > 1). Default OFF ⇒ bit-exact.

[enable_leader_share]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── LEVELING — the counter-force [Boehm 1993 VERIFIED] ────────────────────────────────────────── R-82's
# first working cut had capture with NO opposition and ran to material Gini 0.909 while sitting in
# Hayden's EGALITARIAN density band — chiefdom inequality at forager density, the opposite of his Fig. 6.
# Hayden's thesis needs BOTH: aggrandizers push, the group pushes back, and ABUNDANCE decides who wins.
# Boehm: egalitarian societies run a "reverse dominance hierarchy" — the rank and file act as a coalition
# to suppress upstarts. Of ~47 sanctioned behaviours he tabulates, "lack of generosity or MONOPOLIZING
# RESOURCES" is an explicit trigger (5); the majority involve dominance/self-assertion. The recurring
# sanction against a monopolizer is DESERTION and forced disgorging — the Chaco desert a chief "who was
# stingy", the Nambicuara leave one "too exacting", and "often it is in fact the entire group that
# leaves". MECHANISM: a co-resident coalition sanctions whoever holds conspicuously more material than the
# local norm, forcing him to redistribute the excess to his cell-mates (Boehm's sanction executed as
# Hayden's competitive feast — the two authors' mechanisms are the same act seen from either side). NOTE
# the deliberate asymmetry with capture: leveling is NOT abundance-gated. Capture is (it needs an
# invulnerable surplus); leveling always operates. So abundance alone decides the balance — under scarcity
# capture is gated off while leveling still bites (egalitarian); under abundance capture outruns it
# (stratified). That emergent competition IS Hayden's thesis, and it is what makes it falsifiable here. ──
# LEADER SHARE — "managerial rights" over CORPORATE product (R-83, elite-layer step 1) ────────── THE
# MISSING RUNG between corporate property and personal stratification. Cell ownership in this model is
# CORPORATE (`_cell_owner` maps a cell to a band_id), but stratification needs PERSONS to differ. The
# bridge is not ownership — it is AUTHORITY OVER corporate property. [Hayden 1995 VERIFIED]: on the NW
# Coast aggrandizers "control access to spatially restricted resource locations or productive facilities
# (fishing rocks, weirs, boats, deer fences, drying sheds)"; that class "had MANAGERIAL RIGHTS over the
# resource locations and facilities of the group". Managerial rights, not title — the Big-Man/chiefly
# position. WHY BAND-LEVEL: R-82b's aggrandizer capture was applied per CELL, where 1–2 agents sit, so
# there was no group to skim and the effect was 1.14×. Bands are ~25 agents and already tracked
# (`band_id`), so the corporate unit is the band. Wrong level, not wrong mechanism. NOT HEREDITARY, and
# that is anchored [Boehm 1993 VERIFIED]: leaders are DEPOSABLE — Iroquois sachems were, and among the
# Yokuts even "a HEREDITARY chief ... suspected of too much self-aggrandizement was ... ignored in favor
# of another chief". Councils of elders act as the brake (Navajo, Fox, Yokuts, Tupinamba, Cuna). So the
# office is held on CONTINGENT merit: `band_leaders()` recomputes it each step from cred·prowess, and
# Boehm leveling still bites the holder. Hereditary succession is a LATER rung, and Hayden says it appears
# only where resource locations are spatially restricted (NW Coast) — not where land is ubiquitous (New
# Guinea).

[enable_leveling]
value = true
owner = "DemographyConfig"
type  = "bool"
