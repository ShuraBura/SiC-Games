[enable_orphan_mortality]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── KIN/ORPHAN CHILD MORTALITY (Hill & Hurtado 1996 Table 13.1; MODEL_SPEC §4.6.4; R-74) ──────────
# SUPERSEDES `enable_infanticide` (below). Losing a parent — not birth-spacing — is the dominant killing
# channel among the forest Aché, and it is a HAZARD MULTIPLIER, not a separate event. Table 13.1 ("Kin
# Effects on Child Mortality Rates during the Forest Period: Age 0–9"), a hazard model controlling age,
# age², sex, mother's age, mother's age². Log-parameters → rate ratios: mother alive −1.6277 (p<.001) ⇒
# mother DEAD ×exp(1.6277) = 5.09 ["about fivefold"] father alive −1.1146 (p<.001) ⇒ father DEAD
# ×exp(1.1146) = 3.05 ["about threefold"] parents divorced +1.0892 (p<.001) ⇒ ×exp(1.0892) = 2.97
# ["threefold increase"] Every OTHER kin category is null: adult brothers/sisters, grandmothers,
# grandfathers, aunts, uncles, total kin helpers (p .156–.990) — "parents, but NOT other kin, have a
# strong and unique influence." Mechanism: "A good deal of this effect is due to child homicide" + orphans
# "treated worse" — Table 5.1's homicide/neglect is 39.7% of 0–3 deaths (child homicide 24,
# sacrificed-with-adult 11, left-behind 5, parental infanticide only 7 of 131 = 5.3%). Effects are
# age-PROPORTIONAL (no significant age interaction).

[enable_energetic_fertility]
value = true
owner = "DemographyConfig"
type  = "bool"
# `enable_infanticide` WAS HERE AND IS DELETED (2026-08-06). It was a declared flag that no line of code
# ever read — three separate audits had to re-discover that and write "UNIMPLEMENTED STUB" next to it, and
# `C_ALLON` had to carry a special case to skip it. A switch that does nothing is not documentation, it is
# a standing invitation to believe the mechanism exists. THE SCIENCE IT ENCODED, KEPT: baseline
# infanticide is ALREADY inside the Siler infant curve, which was fit to observed Aché deaths with
# "infanticide KEPT". An explicit mechanism would only add CONDITIONAL infanticide, and Table 5.1 says
# parental infanticide is 5.3% of Aché infant deaths while infancy is nearly sex-SYMMETRIC (38% of male vs
# 41% of female infant deaths are homicide/neglect). The sex bias is at ages 4-14 (28% F vs 6% M) and
# comes from grave accompaniment, not infanticide. R-74's `enable_orphan_mortality` is the mechanism that
# actually carries this channel, and it is built, anchored and ON. economy-fix (Tier-0): births scale with
# maternal reserve, capping the population BEFORE reserves drain to the starvation floor → realistic
# equilibrium reserve (red-team 2b prerequisite)

[enable_intake_fertility]
value = true
owner = "DemographyConfig"
type  = "bool"
# INTAKE-based energetic fertility (supersedes the reserve-based branch above when ON). Measured
# 2026-07-30: the reserve-based version is INERT by construction. Burn is ~68% of the floor-to-full span
# per step, so an agent either re-saturates at the cap or dies within a step; there is no persistent
# intermediate state. Post-harvest reserve reads 0.996 of full and the post-burn trough 0.318, each with
# spread ~0.002 and ZERO response across a 5x density range, so the factor returns ~0.995 always and
# fertility cannot respond to scarcity. Regulation therefore falls entirely on mortality (CDR +59% while
# CBR moves 3%), which forces e0 = 1/CDR ~ 20.7 yr, median age 13 and 8-11% motherless. INTAKE is the live
# signal the reserve level cannot be: p10 0.93 to p90 4.26 of requirement. Ellison's energetics is the
# mechanism — fecundity tracks energy FLUX, not stored reserve.

[enable_metabolic_downreg]
value = true
owner = "DemographyConfig"
type  = "bool"
# slow enough that one bad month does not stop births, fast enough to track a multi-year squeeze METABOLIC
# DOWN-REGULATION under deficit (R-106, 2026-08-28; Keys 1950 Minnesota Starvation, LITERATURE.md; full
# doc MODEL_SPEC §4.6.7). The reserve is spent at a FLAT burn, so any sustained intake below 100% is
# inexorably fatal (even 70% kills in ~5 months) and there is no thin-but-alive state; measured, 96% of
# starvation deaths are ACUTE one-step crashes on agents whose intake-EMA is 2.4x requirement, and
# realised e0 is 23.5 vs schedule 36.5. Under deficit a real body turns its metabolism down (Keys: ~10-25%
# adaptive over weeks, ~40% total incl. mass loss at ~25% weight loss). Triggered on the RESERVE LEVEL —
# low fat stores drive down-regulation (the physiological trigger, leptin), and it buffers the acute crash
# AS it happens, and applies at every age (the intake-EMA is adult-only and, being high on average, would
# never fire for the crash it must stop). burn_eff = burn*(1 - d), d = downreg_max*clamp((1 -
# frac)/downreg_span, 0, 1), frac = (wealth - floor)/(full - floor). Full reserve -> d=0, so bit-exact
# when off AND inert for the well-fed when on. It buffers TRANSIENT crashes without saving a CHRONICALLY
# starving agent (a true mean deficit below the reduced burn still kills), so the Malthusian ceiling for
# real scarcity is preserved (contrast the subsistence floor, Addendum 55, which only relocated death and
# was reverted).

[enable_dependent_load]
value = true
owner = "DemographyConfig"
type  = "bool"
# DEPENDENT LOAD (requires enable_intake_fertility). A mother's energy budget is not her own maintenance —
# she must also cover what her juveniles cannot produce. Counting only her own needs understates the cost
# of a further birth for a woman who already has dependents, which is the anchored driver of forager birth
# spacing (Blurton Jones, Hadza; Kaplan's provisioning model). Denominator becomes own requirement + the
# sum of her living juveniles' UNMET need (their requirement minus what they gathered themselves), so a
# child who increasingly feeds itself costs her less — the load falls as they age, without any explicit
# schedule. BUILT BUT CURRENTLY INERT — and the reason is a finding, not a wiring bug (2026-07-30, R-106).
# Life-history IS on in the village/elite presets (eta_min 0.2, cons_min 0.3, mother-links 91%), yet only
# 1.0% of juveniles run any deficit: measured juvenile eta med 0.529 against consumption_factor med 0.588,
# and with adults harvesting ~1.7x their own burn a juvenile still gathers ~1.5x its requirement. So
# CHILDREN IN THIS MODEL ARE NET FOOD PRODUCERS, which contradicts the Kaplan 2000 net-deficit anchor that
# `consumption_factor` itself cites — the anchor human life-history theory rests on (long juvenile period,
# provisioning, grandmothering). There are no dependents to load. Same root cause as the fertility brake:
# at ~1.7x surplus intake everyone over-produces, including seven-year-olds. UNBLOCK BY: recalibrating the
# juvenile eta ramp against Kaplan's production/consumption curves (foragers do not break even until
# ~18-20 yr), NOT by tuning this mechanism. Kept default-OFF and bit-exact.

[enable_energetic_refractory]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── ENERGETIC REFRACTORY: energy modulates the LENGTH of lactational amenorrhea (R-106, 2026-08-14) ──
# WHY THIS AND NOT THE FECUNDABILITY BRAKE. RESULTS Addendum 42 established the identity TFR = span /
# (refractory + 1/(fecundability x brake)) which reproduces both measured arms to within 1%. The existing
# brake multiplies `fecundability`, and 1/(fecundability x brake) is only 22% of the birth interval — so
# even at its ABSOLUTE ceiling (measured mean factor 0.767 over 240 steps and 331 women) it reaches TFR
# 7.93 where about 4.5 is needed. The REFRACTORY is the term with leverage, and it is also the correct
# physiology: lactational amenorrhea IS the refractory period. THE MECHANISM IS ANCHORED, NOT ASSUMED.
# Ellison 2008 (PaleoAnthropology 2008:172-200, filed) reports for the Toba that C-peptide rises in the
# one to two months before menstruation resumes, correlates with maternal weight and urinary estrogen, and
# shows "no correlations ... with any indices of nursing pattern or frequency" [VERIFIED VERBATIM]. So
# ENERGY sets the length of amenorrhea and suckling frequency does not — the competing pathway is ruled
# out in the same dataset. IT COMPOSES WITH `enable_sedentism_fertility` RATHER THAN FIGHTING IT.
# Sedentism sets the BASE refractory (SEDENTISM_IBI_MONTHS: 30 egalitarian → 22 complex, storable weaning
# foods shorten it); energy STRETCHES whatever base applies. A sedentary woman who is hungry should still
# space births further than a sedentary woman who is not, and multiplying leaves both mechanisms
# independently ablatable. NO NEW THRESHOLD. The energy signal is read through the SAME FAO/IOM window
# `[intake_fert_lo, intake_fert_hi]` = [1.0, 1.2] the fecundability brake already uses (pregnancy +11%,
# lactation +20%). THE STRETCH IS A FILED RATIO, AND IT IS A BRACKET. Hill & Hurtado Table 8.2 gives
# realised IBI across three Aché periods: 34.4 reservation / 37.6 forest / 49.4 contact [VERIFIED]. The
# default 1.436 is 49.4/34.4 — the full span of that filed range, i.e. the most a real Aché population's
# spacing is observed to move. It is a BRACKET ENDPOINT to sweep, NOT a fitted value, and the contact
# period carries disease and social disruption as well as energy stress, so the true energy-only span is
# probably SMALLER. Sweep downward from here; do not adopt 1.436 because a run happens to like it.

[enable_sedentism_fertility]
value = true
owner = "DemographyConfig"
type  = "bool"
# pregnancy is ~+285 ⇒ +11%, lactation ~+20%, so full reproductive capacity needs ~1.2x maintenance)
# SEDENTISM fertility (Neolithic Demographic Transition): birth-spacing SHORTENS with sedentism/complexity
# — mobile foragers space births ~44 mo (carrying cost + prolonged lactational amenorrhea on a low-fat
# mobile diet; !Kung, Howell), sedentary/complex/farming ~24-30 mo (no carrying cost + storable weaning
# foods → earlier weaning → shorter amenorrhea; Sellen & Mace 2007), ~doubling the birth rate
# (Bocquet-Appel 2011). The mother's `ibi_ refractory_months` becomes society-dependent
# (SEDENTISM_IBI_MONTHS). Multiplies with `enable_energetic_fertility` (nutritional-stress suppression
# stays on top). Default OFF ⇒ uniform IBI (bit-exact).

[enable_standing]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── SOCIAL CAPITAL / STANDING — the village anchor with a REAL payoff (P6). Wiessner 1977 (!Kung
# *hxaro*): exchange partnerships need **≥1 yr of reciprocal gifting** before the bond is "firm", each
# person sits in a network of paths, and THAT NETWORK is what covers you in bad years. Status is also
# within-community (von Rueden) — a migrant arrives a low-status outsider. So standing is a RELATIONAL
# third status facet: it accrues with TENURE among your co-resident band and is largely LOST on leaving.
# Because `base_status` weights the harvest contest, the granary draw AND mate choice, leaving is a real
# FITNESS cost — this is the anchor that holds a village together, and it makes dispersal SELECTIVE
# (low-standing juniors leave; established/elite stay). Default OFF ⇒ facet absent, bit-exact.

[enable_store_anchor]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── STORE ANCHOR (P1). The cell granary is a REAL payoff (allocate_store_draw already prevents
# starvation) and is CELL-BOUND — leaving abandons it — but the mover never sees it
# (`diffusion_select_target` weighs only forage S). Testart 1982: delayed-return STORAGE is what makes
# foragers sedentary; you don't walk away from a full granary for a 5% better patch. Unlike `standing` (a
# RELATIVE contest weight, which cancels on an empty cell), the store is an ABSOLUTE place-bound value ⇒
# it is what actually anchors. Perceived as the per-capita stored buffer amortised over
# `store_anchor_horizon` steps. Default OFF (gain 0) ⇒ bit-exact.

[enable_provisioning]
value = true
owner = "DemographyConfig"
type  = "bool"
# Resource-Ecology Phase C.2b: mother-linked provisioning. A mother's harvest that overflows her reserve
# cap (otherwise wasted) is redirected to her dependent children (age < forage_age_min). Flow-based
# (adults at the cap have no reserve headroom to give); the variance lands on the mother's cell quality.
# Forage-only = the gathered-plant kin-sharing tier (Gurven 2004).

[enable_life_history]
value = true
owner = "DemographyConfig"
type  = "bool"
# Newborn→adult LIFE-HISTORY transition (Kaplan 2000 cooperative breeding): when ON, the model auto-uses a
# MONTH-scaled LifeHistoryConfig (forage_age_min=180=15yr, forage_age_max_offset=120=10yr) so a child's
# production (η ramp 0.2→1), maintenance (0.3→1) and reserve (0.3→1) all ramp over childhood — the graded
# juvenile deficit that provisioning covers. Fixes the gap where lh_config was never passed → newborns
# foraged at full adult rate. Pair with enable_provisioning (feed the deficit). Default OFF ⇒ no juvenile
# penalty.

[enable_condition]
value = true
owner = "DemographyConfig"
type  = "bool"
# Biome-Mortality S0: lagged body-condition / immune-competence signal. When ON, the nutrition×disease
# synergy reads a slow EMA of nutritional status (`_condition`) instead of the instantaneous (bang-bang)
# reserve — so sustained undernutrition potentiates DISEASE mortality (Pelletier), routing the seasonal
# squeeze through graded disease rather than the hard starvation floor (R-8/R-10 critical-path fix).

[enable_density_reference]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── DENSITY-DISEASE REFERENCE NORMALISATION (R-106, 2026-08-13) ────────────────────────────────────────
# THE DEFECT. `a2_mult` multiplies three modulators into Siler's Makeham term. TWO of them are
# reference-normalised so that the ANCHOR CONDITION returns exactly 1.0 — `risk_mult` divides by
# `risk_ref` ("≈1 in average-risk terrain") and `pathogen_mult` is "mean-normalised so
# pathogen_mult(npp_ref) = 1 (the Aché-forest reference biome is neutral)". `density_mult` is NOT. It
# returns 1.0 only at ρ = 0, an EMPTY WORLD. WHY THAT IS A DOUBLE-COUNT. Gurven & Kaplan 2007 fitted a2 =
# 0.0130 on Aché foragers who were LIVING AT A REAL DENSITY, so that coefficient already contains whatever
# density-dependent disease those people experienced. Multiplying it again at the same density charges for
# it twice. MEASURED SIZE. `dens_rho_half` = 0.2/km² sits ABOVE the whole ethnographic range (Binford
# packing 0.091/km²; Tallavaara observed HG median 0.119/km²; this model's own Tallavaara capacity at its
# terrain median NPP ≈ 0.053/km²), so every real forager density lies on the steep rising limb. At
# Binford's own anchor the unnormalised term already returns 1.94x. The measured non-starvation hazard
# runs 1.56x the configured Siler, and realised e0 is 17.7 yr against a configured 36.6. AND THE DYNAMICS
# AMPLIFY IT. `aggl_beta` = 1.15 gives increasing returns to crowding, so agents pack into cells of ~71
# (0.714/km², EIGHT times the Binford anchor and 3.6x past half-saturation), which drives the term to
# 3.34x against its 4.0 ceiling. The error is in the maths; the agglomeration makes it large. THE FIX
# INTRODUCES NO NEW NUMBER. `dens_rho_ref` defaults to Binford 2001's packing threshold, which is already
# filed (LITERATURE.md: "forager packing threshold 9.098 persons/100 km² = 0.091/km²"). Default OFF ⇒
# every prior run stays bit-exact.

[enable_game]
value = true
owner = "DemographyConfig"
type  = "bool"
# Game/meat economy (the Carbon substrate; MODEL_SPEC §4.5.5, blueprint v2). The cell yield is split into
# a forage stream (household, shared at κ=0) and a meat stream (band-pooled, Cred-weighted at κ>0 — the
# status/show-off sharing of high-variance game, Kaplan & Hill 1985 / Hawkes 1991). `game_meat_frac` = the
# diet animal fraction by biome (Cordain 2000 Table 2, terrestrial-renormalized; terrain.MEAT_FRAC).
# Energy-conserving: at κ=0 forage+meat == the single stream (exact back-compat; default 0 = forage-only).

[enable_biome_meat_frac]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── PER-BIOME two-stream economy (wired 2026-08-08; RESULTS Addendum 37) ────────────────────────────────
# Until this date both quantities above were SCALARS, so a campaign gave every biome the same diet split
# and the same meat variance. MODEL_SPEC §4.5.5 said so ("`mf` is a scalar config ... the per-biome
# `terrain.MEAT_FRAC` dict is the home for a future per-cell wiring"), and Addendum 36 measured the
# consequence: no biome signal reached the harvest at all, because `game_kcal` is not read either. Each
# flag reads the cell's biome from an ALREADY ANCHORED dict. Neither introduces a new number.
# enable_biome_meat_frac → `terrain.MEAT_FRAC` (Cordain 2000 Table 2, terrestrial-renormalized)
# enable_biome_meat_cv → `terrain.MEAT_CV` (cchunts day-to-day CV; Hawkes 1991 for the Hadza) ABSENT
# BIOMES FALL BACK, AND THE FALLBACK DIFFERS BY DICT — because the two dicts document different reasons
# for absence. `MEAT_FRAC` omits WETLAND deliberately ("a gap, not a measured zero" — a 0.0 there would
# assert that wetland foragers eat no meat), so an absent biome takes the SCALAR `game_meat_frac`.
# `MEAT_CV` omits GRASS/MOUNTAIN/WETLAND for want of a calibration people, and terrain.py's own rule for
# that case is `HUNT_CV` = 2.11, the biome-INVARIANT measured hunting CV — so an absent biome takes it. Do
# not "fix" either fallback to 0.0; both zeros would be claims that no source supports. Both default False
# ⇒ every prior run stays bit-exact. `enable_game` and `game_meat_frac > 0` still gate the whole
# two-stream path, so the scalar remains the master switch as well as the fallback value.

[enable_biome_meat_cv]
value = true
owner = "DemographyConfig"
type  = "bool"
# (channel note, inherited) ── PER-BIOME two-stream economy (wired 2026-08-08; RESULTS Addendum 37)
# ──────────────────────────────── Until this date both quantities above were SCALARS, so a campaign gave
