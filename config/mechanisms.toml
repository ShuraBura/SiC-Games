[enable_leader_office]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── R-84 CHALLENGE-SUCCESSION: leadership as a TENURED OFFICE, and the two ways it is LOST ───────────
# DEFECT this fixes: `band_leaders()` recomputes argmax(cred·prowess) EVERY step ⇒ zero incumbency. There
# is no office, no tenure, and a leader is never *removed* — he merely stops being the maximum. The
# ethnography is the reverse: leadership is HELD, and lost to a SANCTION. ANCHOR [Boehm 1993 Table I,
# VERIFIED — columns counted from the 48-society world survey]: Public opinion 10 · Criticism 6 · Ridicule
# 5 · Disobedience 7 · **DEPOSITION 9** · **DESERTION 17** · Exile 2 · Execution 10. DESERTION outnumbers
# DEPOSITION ≈2:1 — the commonest end of a bad leader is that his following WALKS AWAY, not a
# challenge-and-defeat duel ("if a bad chief was not deposed he might be deserted gradually" — Iban,
# Freeman 1970:114; "an entire dissatisfied lineage might simply go away" — Mandari, Buxton). And the
# split is structural, not arbitrary: DEPOSITION societies are the centralized ones (Iroquois sachems, Yap
# chiefs, Somali sultans, Iban, Assiniboin, Coeur d'Alene, Yokuts) while DESERTION societies are
# mobile/dispersed (Batek, Mendrig, Apache, Kutchin, Ute, Nambicuara, Yanomamö, Patagonia) — i.e. Sahlins'
# Nootka-vs-Siuai and Hayden's restricted-vs-ubiquitous resources, showing up as a sanction frequency.
# TRIGGERS [Boehm 1993, the 47 coded motivations for negative sanctioning]: "dominating others as leader"
# (14) + "lack of generosity or monopolizing resources" (5) = OVERREACH (19); "ineffectiveness,
# partiality, or unresponsiveness in a leadership role" (10) = FAILURE TO DELIVER. Hence
# `office_overreach_weight` = 19/29. THE LOOP THIS CLOSES: overreach is read off the leader's OWN material
# relative to his band — which is exactly what `leader_share_frac` inflates. A greedier levy raises the
# sanction hazard on the man taking it. Boehm's reverse dominance hierarchy as a feedback loop, not a
# constant.

[enable_legitimacy]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── DM-F1 / R-86: THE LEGITIMACY CHANNEL — how ACHIEVED success becomes ASCRIBED rank ────────────────
# WHY THIS EXISTS. Flannery & Marcus 2012 ch.10 is blunt that our elite layer's premise is insufficient:
# "if feasting were all it took to produce hereditary inequality, there would have been no
# achievement-based societies left for anthropologists to study" — competitive feasting "produced
# individual Big Men who had no way of bequeathing renown to their offspring." That is EXACTLY what the
# model measures (R-83/R-84: leaders 3.68× ahead, father-was-leader only 53–69%, no transmission), i.e.
# the model is a correct ACHIEVEMENT-BASED society and hereditary rank needs a different mechanism. THE
# MECHANISM [Friedman's endogenous scenario, via Flannery ch.10 VERIFIED]: rank is created by a
# REINTERPRETATION of success, not by accumulation. Successful lineages were not credited with hard work —
# "they believed that one only obtained good harvests through proper sacrifices to the nats. The key shift
# in social logic was therefore from 'They must have pleased the nats' to 'They must be descended from
# higher nats than we are.'" Once a lineage is held to descend from the ruling spirits it controls the
# region's land and "was also entitled to receive tribute from other lineages". CHARTER DECLARATION
# (MECHANISM_CHARTER §3.1): TYPE C (Conversion) — material → heritable cred, gated on a legitimating
# belief. An OFF-DIAGONAL of the capital matrix: the achieved→ascribed cell. UNIT LINEAGE (patriline
# `_lineage`), competing WITHIN a band. Friedman's unit is explicit: "one lineage convinces all the
# others". NOT the band, and not the agent (cf. R-82's unit error). INVARIANT DEBITED, not catalytic —
# sponsoring the sacrifice SPENDS material ("could sponsor the most prestigious sacrifices and feed the
# most visitors"); belief is bought, not merely asserted. ANCHOR [VERIFIED Flannery & Marcus 2012 ch.10]
# for the mechanism; the four rates are [DESIGN], calibrated against TARGETS T-6 (Hayden's 75%
# father-was-leader) and T-5 (BHM composite Gini). NOTE on the seam: MECHANISM_CHARTER §9.2 named
# `GroupVector.religion` as the carrier. On inspection that cell is an int RELIGION ID, while legitimacy
# is a continuous per-LINEAGE stock — so it lives on the model as `_lineage_legit` (mirroring
# `_band_surplus`), and `religion` stays reserved for actual religion ids.

[enable_delegitimation]
value = true
owner = "DemographyConfig"
type  = "bool"
# ── DM-F1 stage 2 / R-87: DELEGITIMATION — the gumsa → gumlao collapse ───────────────────────────────
# NOT optional polish. R-86 built the ascription RATCHET and it works (father-was-leader 76% vs Hayden's
# 75%), but a ratchet with no reverse HAS NO EQUILIBRIUM: `ascribed_frac_pop` reaches 0.70–0.85, at which
# point "descended from higher nats" stops being a distinction. The model derived the need for a collapse.
# ANCHOR [Leach via Flannery ch.10, VERIFIED]: Kachin society shifts between ranked (**gumsa**) and
# egalitarian (**gumlao**) modes — "hereditary inequality was repeatedly created, lasted for a few
# generations, and then collapsed." The driver is accumulated RESENTMENT, not an instantaneous check:
# ambitious leaders' prestige-seeking "only increased their followers' resentment and HASTENED THEIR
# OVERTHROW." gumlao premise 1 is "All lineages are considered equal" — a WHOLE-COMMUNITY reversion, which
# is why the flip is per-BAND rather than per-lineage. THIS IS THE H-CYCLES TEST. MECHANISM_CHARTER §5:
# every feedback in the model so far is INSTANTANEOUS negative feedback ⇒ a stable node ⇒ exponential
# return, never oscillation (three independent negatives, DE-14). A DELAYED negative feedback is what
# admits a complex eigenvalue pair. `resent_alpha` IS that delay, and it is the one parameter the
# hypothesis actually rides on. Ethnographic period to hit: "a few generations" ≈ 60–100 yr ≈ 720–1200
# steps.

[enable_prowess_facet]
value = true
owner = "DemographyConfig"
type  = "bool"
# Cred-vector (B+ stage). `cred` is the LINEAGE facet (ascribed). When `enable_prowess_facet`, the PROWESS
# facet (achieved) joins the contest weight multiplicatively (Cobb–Douglas, equal within-domain
# exponents): weight = ((cred+ε)·(prowess+ε))^κ. Default off → lineage-only = R-18 exact. Build step 1
# ships the seam; prowess GROWTH/decay (earned from provisioning) is step 2. See
# SiC_Games_P1_CredVector_BplusPaternity bp.

[enable_paternity]
value = true
owner = "DemographyConfig"
type  = "bool"
# B+ step 4: PATERNITY. At each IBI conception a father is assigned by prowess-weighted mate-choice —
# P(father=j) ∝ (prowess_j+ε)^mate_choice_strength among living adult males (m=0 = random = the
# drift-control) — and the child's LINEAGE inherits a BILATERAL blend of the parents' TOTAL standing
# (cred·prowess, folding the father's hunting record into the child's ascribed rank), with MEAN-REVERSION
# toward the population mean (lineage_reversion ρ = the c_lineage homeostat; lineage has no decay
# otherwise — red-team RT-3). Calibrate mate_choice_strength to status→RS r≈0.19 (von Rueden).
# enable_paternity off → matrilineal (step-1). Reopens R-14 minimally: fertility stays female-IBI (this
# only sets WHO fathers / how lineage propagates).

